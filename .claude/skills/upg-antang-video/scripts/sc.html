  food.push({f,x:gx+((i*53)%5-2)*0.02,y1:-0.12-((i*17)%6)*0.06,z:0.42+((i*29)%3)*0.03,d:i*0.13});}

    if(name==='sc_bersih'){const z=ease(ph/0.5);camera.position.set(0,cl(-0.2,0,z),cl(5.5,8,z));camera.lookAt(0,-0.3,0);
      scene.background=COOL.clone().lerp(WARM,ease(ph));fill.intensity=60*ease(ph);sun.intensity=2.2;
      const tx=cl(-3.2,3.2,ease((t-0.2)/(D*0.62)));scaler.visible=t<D*0.75;scaler.position.set(tx+Math.sin(t*90)*0.012,-0.1,0.42);scaler.rotation.set(0,0,0.12);
      kar2.forEach(o=>{const dt=t-(0.2+((o.x+3.2)/6.4)*D*0.62);if(dt>0){const f=Math.min(1,dt/0.6);o.k.position.set(o.p.x+dt*0.4*(o.d-0.5),o.p.y-1.8*dt*dt-0.2*dt,o.p.z+0.3*dt);o.k.scale.setScalar(Math.max(0,1-f));o.k.rotation.set(dt*6,dt*4,0);}});
      const w=ease((t-D*0.55)/(D*0.35));teethMat.color.set('#F6F0E2').lerp(new THREE.Color('#FFFFFF'),w);
      sp.forEach((m,i)=>{const a=(t*1.4+i*0.37)%1;m.visible=w>0.3;m.position.set(-2.4+i*0.37,-0.3+0.15*Math.sin(i*2.1),0.5);m.scale.setScalar(Math.sin(a*Math.PI)*1.6);m.material.opacity=w*Math.sin(a*Math.PI);});
      if(t<D*0.55)txt('Scaling','Karang diangkat','',t,0.2);else txt('Hasilnya','Licin & segar','',t,D*0.55);}
    renderer.render(scene,camera);}
  if(name==='promo'){$('ftgB').style.display='block';$('promo').style.display='flex';
    [['q1',0.05],['q2',0.4],['q3',2.2],['q4',2.6],['q5',(window._fo||{}).q5||5.5]].forEach(([id,tin])=>{const k=ease((t-tin)/0.3);$(id).style.opacity=k;$(id).style.transform=`scale(${0.85+0.15*k})`;});
    $('q2l').style.width=(ease((t-1.6)/0.4)*112)+'%';}
  if(name==='cta'){const o=window._fo||{};$('ftg').style.display='block';$('cta').style.display='block';$('G').style.top='330px';
    if(o.p)txt(o.p0||'',o.p,'',t,o.tin||0.1);
    const kb=ease((t-(o.tb||0.6))/0.35);$('bub').style.opacity=kb;$('bub').style.transform=`translateY(${(1-kb)*60}px)`;
    const nch=Math.max(0,Math.min(7,Math.floor((t-(o.tb||0.6)-0.2)/0.09)));$('typ').textContent='SCALING'.slice(0,nch)+(nch<7&&kb>0.5?'|':'');
    const ka=ease((t-(o.ta||1.6))/0.3);$('arw').style.opacity=ka;$('arw').style.transform=`translateY(${Math.sin(t*6)*18}px)`;$('arwt').style.opacity=ka;}
  if(name==='foot'){const o=window._fo||{};$('ftg').style.display='block';$('G').style.top=(o.top||330)+'px';
    if(o.p2&&t>=o.tin2)txt(o.l2||'',o.p2,o.cls||'',t,o.tin2);else if(o.p)txt(o.p0||'',o.p,o.cls||'',t,o.tin||0.2);
    if(o.chips)chips(o.chips,t);}
  else $('G').style.top='330px';
  if(name==='price'){$('ftgB').style.display='block';const P=$('price');P.style.display='flex';
    [['pk2',0.1],['pk3',0.35],['pk4',0.55],['pk5',1.4]].forEach(([id,tin])=>{const k=ease((t-tin)/0.3);$(id).style.opacity=k;$(id).style.transform=`scale(${0.85+0.15*k})`;});}
  if(name==='end'){$('endline').textContent=(window._fo||{}).endline||'Behel mulai Rp3 jt/rahang · bisa dicicil';$('endc').style.display='flex';$('endc').style.opacity=ease(t/0.4);}
  const fd=window._fade;if(fd!==undefined)$('fade').style.opacity=fd;
};
window.ready=true;
</script></body></html>

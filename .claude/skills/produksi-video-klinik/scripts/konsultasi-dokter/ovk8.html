<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Lapisan Teks Tambal Sementara</title><style>
/* Organik jangan berhenti di tambal sementara, drg. Ainun (25 Nov 2026 sore). Logo pojok standar, teks y>=360, caption kinetik 2-4 kata (kata kunci blok Turquoise),
   kartu centang, kartu harga (normal dicoret), penutup standar inline. Montserrat = pengganti sementara Neue Montreal. */
@font-face{font-family:M;src:url(montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:M;src:url(montserrat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:M;src:url(montserrat-latin-700-normal.woff2);font-weight:700}
:root{--deep:#354B49;--turq:#28CDBD;--mint:#E8F8F6}
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:M,sans-serif;color:var(--deep)}
.o{position:absolute}
.lp{position:absolute;left:72px;top:262px}
.lp img{height:72px;display:block;filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 2px 8px rgba(0,0,0,.45))}
.ttl{left:72px;right:140px;top:380px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;transform-origin:left center}
.ttl span{font:700 58px/1.12 M;white-space:nowrap;background:#fff;padding:10px 22px 12px;border-radius:12px}
.ttl span.k{background:var(--turq)}
.sub{left:90px;right:140px;top:1380px;display:flex;justify-content:center}
.sub p{font:700 50px/1.3 M;background:rgba(255,255,255,.94);padding:12px 26px 14px;border-radius:18px;text-align:center}
.sub .k{background:var(--turq);padding:0 10px;border-radius:8px;white-space:nowrap}
.cek{left:72px;top:380px;display:flex;flex-direction:column;gap:16px}
.cek div{display:flex;align-items:center;gap:18px;font:700 46px/1 M;background:#fff;padding:16px 24px 16px 16px;border-radius:16px;opacity:0}
.cek i{font-style:normal;width:54px;height:54px;border-radius:50%;background:var(--turq);display:grid;place-items:center;font:700 32px/1 M}
.harga{left:90px;right:150px;top:1090px;background:#fff;border-radius:28px;padding:30px 40px;box-shadow:0 10px 40px rgba(53,75,73,.14)}
.harga .t{font:700 34px/1 M;background:var(--turq);display:inline-block;padding:12px 18px;border-radius:10px}
.harga .n{font:600 36px/1 M;color:#5E6B67;text-decoration:line-through;margin-top:22px}
.harga .p{font:700 104px/1 M;letter-spacing:-2px;margin-top:14px}
.harga .s{font:600 36px/1.3 M;margin-top:14px}
.pen{left:0;top:0;width:1080px;height:1920px;background:var(--mint)}
.pen .wrap{position:absolute;left:90px;right:150px;top:330px;bottom:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.pen .pesan{font:700 54px/1.25 M;text-align:center}
.pen .logo{width:500px}
.pen .tag{font:600 32px/1.3 M;color:#5E6B67;text-align:center;margin-top:-10px}
.pen .kontak{display:flex;flex-direction:column;gap:18px;margin-top:18px;width:100%;max-width:760px}
.pen .row{display:flex;align-items:center;gap:20px;background:#fff;border-radius:18px;padding:18px 22px}
.pen .row b{flex:none;font:700 26px/1 M;background:var(--turq);padding:12px 14px;border-radius:10px;min-width:150px;text-align:center}
.pen .row span{font:600 34px/1.25 M}
.step{left:72px;top:380px;display:flex;align-items:center;gap:14px;transform-origin:left center}
.step b{font:700 34px/1 M;background:var(--turq);padding:14px 18px;border-radius:12px}
.step span{font:700 42px/1 M;background:#fff;padding:14px 22px;border-radius:12px}
</style></head><body><div id="r"></div><script>
const E=[[0.05, 1.19, "<div class=\"o sub pp\"><p>terus sampai <span class=k>selesai,</span></p></div>"], [1.19, 2.7, "<div class=\"o sub pp\"><p>sampai <span class=k>tambal permanen</span></p></div>"], [3.12, 4.86, "<div class=\"o sub pp\"><p><span class=k>berlubang</span></p></div>"], [4.9, 6.76, "<div class=\"o sub pp\"><p>yang di <span class=k>sebelah mana?</span></p></div>"], [6.8, 8.71, "<div class=\"o sub pp\"><p><span class=k>kiri bawah</span></p></div>"], [8.84, 9.42, "<div class=\"o sub pp\"><p>dari kapan</p></div>"], [9.42, 10.26, "<div class=\"o sub pp\"><p>kita rasa <span class=k>sakit?</span></p></div>"], [10.28, 11.26, "<div class=\"o sub pp\"><p><span class=k>satu bulan</span></p></div>"], [11.64, 12.4, "<div class=\"o sub pp\"><p>beberapa jam,</p></div>"], [12.4, 13.25, "<div class=\"o sub pp\"><p><span class=k>sakit lagi</span></p></div>"], [13.52, 14.32, "<div class=\"o sub pp\"><p>malam-malam</p></div>"], [14.32, 15.3, "<div class=\"o sub pp\"><p><span class=k>tambah sakit</span></p></div>"], [15.5, 16.14, "<div class=\"o sub pp\"><p>nanti saya</p></div>"], [16.14, 17.39, "<div class=\"o sub pp\"><p>periksa <span class=k>gigi kita dulu</span></p></div>"], [17.55, 19.39, "<div class=\"o sub pp\"><p>kalau memang <span class=k>sakit,</span></p></div>"], [19.39, 19.81, "<div class=\"o sub pp\"><p>tak tahan,</p></div>"], [19.81, 20.85, "<div class=\"o sub pp\"><p>angkat <span class=k>tangan kiri saja</span></p></div>"], [21.0, 21.6, "<div class=\"o sub pp\"><p>kalau misalnya</p></div>"], [21.6, 22.88, "<div class=\"o sub pp\"><p><span class=k>tambal sementara</span></p></div>"], [22.88, 23.7, "<div class=\"o sub pp\"><p>terus <span class=k>gak sakit</span></p></div>"], [23.7, 24.92, "<div class=\"o sub pp\"><p>terus <span class=k>berhenti</span></p></div>"], [24.92, 25.98, "<div class=\"o sub pp\"><p>perawatan, iya</p></div>"], [25.98, 27.14, "<div class=\"o sub pp\"><p>harus sampai</p></div>"], [27.14, 28.6, "<div class=\"o sub pp\"><p><span class=k>tambal permanen</span></p></div>"], [0.1, 3.0, "<div class=\"o ttl pp\"><span>Sudah tidak sakit setelah</span><span>tambal sementara?</span><span class=k>Jangan berhenti dulu.</span></div>"], [3.1, 11.4, "<div class=\"o step pp\"><span>Keluhannya</span></div>"], [11.5, 15.4, "<div class=\"o step pp\"><span>Sudah sebulan</span></div>"], [15.5, 20.9, "<div class=\"o step pp\"><span>Diperiksa dulu</span></div>"], [21.0, 28.75, "<div class=\"o step pp\"><span>Pesan dokter</span></div>"], [28.85, 31.35, "<div class=\"o ttl pp\"><span>Tambal sementara</span><span>belum selesai.</span><span class=k>Lanjut sampai permanen.</span></div>"], [0, 31.35, "<div class=lp><img src=\"logo.png\" alt=\"Ruma Dental\"></div>"], [31.4, 35.45, "<div class=\"o pen\"><div class=wrap><p class=\"pesan el\">Sudah tidak sakit?<br>Lanjut sampai tambal permanen.</p><img class=\"logo el\" src=\"logo.png\" alt=\"Ruma Dental\"><p class=\"tag el\">Tempat Nyaman untuk Kembali Tersenyum</p><div class=kontak><div class=\"row el\"><b>Instagram</b><span>@rumadentalmks</span></div><div class=\"row el\"><b>WhatsApp</b><span>0898-7735-463</span></div><div class=\"row el\"><b>Alamat</b><span>Jl. Rusa No. 65, Maricaya, Makassar</span></div></div></div></div>"]];
const CK=[999,999,999];
window.go=t=>{const r=document.getElementById('r');let h='';
 E.forEach(([a,b,x])=>{if(t>=a&&t<b){const op=Math.min(1,(t-a)/0.18);h+=`<div style="opacity:${op.toFixed(3)}" data-a="${a}">${x}</div>`}});
 r.innerHTML=h;
 r.querySelectorAll('[data-a]').forEach(w=>{const a=+w.dataset.a;const p=Math.min(1,(t-a)/0.16);
   const sc=p<1?(0.86+0.18*p):(1.04-0.04*Math.min(1,(t-a-0.16)/0.1));
   w.querySelectorAll('.pp').forEach(e=>{e.style.transform=`scale(${sc})`});
   w.querySelectorAll('.el').forEach((e,i)=>{const q=Math.max(0,Math.min(1,(t-a-0.1-0.22*i)/0.25));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*14}px)`});});
 [['.c1',CK[0]],['.c2',CK[1]],['.c3',CK[2]]].forEach(([s,c])=>{const e=r.querySelector(s);if(e){const q=Math.max(0,Math.min(1,(t-c)/0.16));e.style.opacity=q;e.style.transform=`scale(${q<1?0.86+0.18*q:1})`}});};
</script></body></html>

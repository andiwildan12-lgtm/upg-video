</span></div><div class=o2><i class=\"on pp\">Yes</i><i class=\"\">No</i></div></div></div>"], [0.0, 1.55, "<div class=\"o sub pp\"><p>1, 2, <span class=k>3</span></p></div>"], [21.58, 22.45, "<div class=\"o sub pp\"><p>kenapa?</p></div>"], [22.5, 24.9, "<div class=\"o sub pp\"><p>karena sebagian besar orang</p></div>"], [25.5, 26.84, "<div class=\"o sub pp\"><p>ruang untuk</p></div>"], [26.84, 27.78, "<div class=\"o sub pp\"><p>tumbuh <span class=k>gigi bungsunya</span></p></div>"], [27.78, 28.4, "<div class=\"o sub pp\"><p> <span class=k>tidak cukup</span></p></div>"], [0.1, 1.55, "<div class=\"o ttl pp\"><span>Pilih mana, dok?</span><span class=k>6 jawaban cepat drg. Ainun</span></div>"], [0, 32.4, "<div class=lp><img src=\"logo.png\" alt=\"Ruma Dental\"></div>"], [32.45, 36.5, "<div class=\"o pen\"><div class=wrap><p class=\"pesan el\">Kamu pilih yang mana?</p><img class=\"logo el\" src=\"logo.png\" alt=\"Ruma Dental\"><p class=\"tag el\">Tempat Nyaman untuk Kembali Tersenyum</p><div class=kontak><div class=\"row el\"><b>Instagram</b><span>@rumadentalmks</span></div><div class=\"row el\"><b>WhatsApp</b><span>0898-7735-463</span></div><div class=\"row el\"><b>Alamat</b><span>Jl. Rusa No. 65, Maricaya, Makassar</span></div></div></div></div>"]];
const CK=[999,999,999];
window.go=t=>{const r=document.getElementById('r');let h='';
 E.forEach(([a,b,x])=>{if(t>=a&&t<b){const op=x.includes('data-nf')?1:Math.min(1,(t-a)/0.18);h+=`<div style="opacity:${op.toFixed(3)}" data-a="${a}">${x}</div>`}});
 r.innerHTML=h;
 r.querySelectorAll('[data-a]').forEach(w=>{const a=+w.dataset.a;const p=Math.min(1,(t-a)/0.16);
   const sc=p<1?(0.86+0.18*p):(1.04-0.04*Math.min(1,(t-a-0.16)/0.1));
   w.querySelectorAll('.pp').forEach(e=>{e.style.transform=`scale(${sc})`});
   w.querySelectorAll('.el').forEach((e,i)=>{const q=Math.max(0,Math.min(1,(t-a-0.1-0.22*i)/0.25));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*14}px)`});});
 [['.c1',CK[0]],['.c2',CK[1]],['.c3',CK[2]]].forEach(([s,c])=>{const e=r.querySelector(s);if(e){const q=Math.max(0,Math.min(1,(t-c)/0.16));e.style.opacity=q;e.style.transform=`scale(${q<1?0.86+0.18*q:1})`}});};

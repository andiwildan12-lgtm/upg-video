  if(T>=K.tiga-0.3&&T<K.kok){[nA,nB,opp].forEach((t,i)=>glow(t,0.55*P(T,K.tiga-0.3+i*0.25,0.25)));}
  if(T>=K.kirikanan&&T<K.lawan)[nA,nB].forEach(t=>glow(t,0.35+0.15*Math.sin(T*6)));
  if(T>=K.lawan&&T<K.satucelah)glow(opp,0.4+0.15*Math.sin(T*6));
  if(T>=K.tigageser&&T<K.masalah)[nA,nB,opp].forEach((t,i)=>glow(t,0.55*P(T,K.tigageser+i*0.2,0.25)));
  if(T>=K.ingat){const all=[...lower,...upper];all.forEach(t=>{const ph=(T-K.ingat)*0.9-(Math.atan2(wpos(t).x,wpos(t).z)+1.8)/3.6;glow(t,0.7*Math.max(0,Math.sin(Math.PI*Math.min(1,Math.max(0,ph)))));});}
  ringM.opacity=0;
  if(T>=K.satucelah&&T<K.masalah)ringM.opacity=0.7*P(T,K.satucelah,0.3);
  if(T>=K.cabut+0.6&&T<K.tiga)ringM.opacity=0.6*P(T,K.cabut+0.6,0.3);
  // food & plaque in new gaps
  food.forEach(f=>{const g=gNew[f.userData.g];const t0=(f.userData.pl?K.plak:K.sisa)+f.userData.d;const vis=(T>=t0&&T<K.good+0.4)||(T>=K.s3&&T<K.bersih+0.6+f.userData.d*2);
    f.visible=vis;if(!vis)return;let k=back(P(T,T>=K.s3?K.s3:t0,0.4));if(T>=K.s3)k*=1-P(T,K.bersih+0.4+f.userData.d*2,0.3);
    f.position.copy(g).add(f.userData.o);f.scale.setScalar(Math.max(0.001,k));});
  // interdental brush
  ib.visible=T>=K.bersih-0.4&&T<K.ingat-0.3;
  if(ib.visible){const g=gNew[0];const inK=ease(P(T,K.bersih-0.4,0.6));const osc=T>K.bersih+0.2?Math.sin((T-K.bersih)*9)*0.25:0;
    const dirOut=V(g.x,0,g.z).sub(V(0,0,-0.4)).normalize();ib.position.copy(g).setY(0.45).addScaledVector(dirOut,cl(2.0,0.15,inK)+osc);ib.rotation.y=Math.atan2(-dirOut.z,dirOut.x);}
  // ---------- books ----------
  const bk=books[4];const bl=ease(P(T,K.ambil,0.9));
  bk.m.visible=bl<0.999;placeBook(bk,0,1);bk.piv.position.z=1.6*bl;bk.piv.position.y=1.11+0.35*Math.sin(Math.PI*bl);bk.m.material.transparent=true;bk.m.material.opacity=1-P(T,K.ambil+0.6,0.3);
  const lean=ease(P(T,K.miringb+0.3,1.6));
  [[3,1,0.32],[2,1,0.1],[1,1,0.03],[5,-1,0.32],[6,-1,0.1],[7,-1,0.03]].forEach(([i,s,a])=>placeBook(books[i],a*lean,s));
  [0,8].forEach(i=>placeBook(books[i],0,1));
  // ---------- section ----------
  let pulpCol=new THREE.Color('#D9797B');
  if(T<K.psa){const pu=Math.max(0,Math.sin((T-K.s1)*Math.PI*1.4));pulpCol.lerp(new THREE.Color('#C85A5E'),0.6*pu);}
  const clean=P(T,K.yaitu,1.6);pulpCol.lerp(new THREE.Color('#F3E6C8'),clean);pulpCap.material.color.copy(pulpCol);
  const fk=ease(P(T,K.yaitu+1.5,1.6));clipP.constant=-(SY+cl(1.5,-4.0,fk));fillCap.visible=fk>0.001;
  file.visible=fileH.visible=T>=K.yaitu&&T<K.yaitu+1.7;
  if(file.visible){const y=1.0+0.6*Math.abs(Math.sin((T-K.yaitu)*5));file.position.set(0.55,y,FZ+0.06);file.rotation.z=0.08;fileH.position.set(0.55+0.13,y+1.75,FZ+0.06);fileH.rotation.z=0.08;}
  const restore=ease(P(T,K.pakai,0.9));const cc=new THREE.Color('#3A2A22').lerp(new THREE.Color('#FFFDF8'),restore);cavCap.material.color.copy(cc);neckCap.material.color.copy(cc);
  cavCap.scale.setScalar(1);
  const sideShot=(T<K.kok)||(T>=K.gigijuga+0.55&&T<K.nggak)||(T>=K.good&&T<K.s1)||(T>=K.s2&&T<K.ingat);
  [...lower,...upper].forEach(t=>{t.g.visible=!(sideShot&&wpos(t).x<-0.2);});
  // ---------- camera ----------
  const S=(x,y,z)=>V(x,y+SY,z);
  const lw=lp.clone();const out=V(lw.x,0,lw.z).sub(V(0,0,-0.4)).normalize();
  const side=(d,h,ly=1.05,off=0)=>{const pos=lw.clone().addScaledVector(out,d).add(V(0,h,0));const tan=V(-out.z,0,out.x);pos.addScaledVector(tan,off);return [pos,V(lw.x,ly-0.9,lw.z)];};
  const shots=[
   [0,t=>{const k=ease(P(t,0,4.4));const [p,l]=side(cl(7.8,9.0,k),cl(2.6,1.5,k),1.0,cl(-1.4,0.6,k));return [p,l];}],
   [K.kok,t=>{const k=P(t,K.kok,2.4);return [V(-2.2+1.2*k,3.6,10.5),V(0,2.2,0)];}],
   [K.ambil-0.1,t=>{const k=P(t,K.ambil,4.6);return [V(1.4-1.4*k,3.0,8.4-0.6*k),V(0,2.1,0)];}],
   [K.gigijuga+0.55,t=>{const k=P(t,K.gigijuga,4.0);return side(9.2,1.3,1.0,cl(1.0,0.2,k));}],
   [K.lawan-0.1,t=>{const k=P(t,K.lawan,3.3);return side(8.4,1.0,1.2,cl(-0.5,0.2,k));}],
   [K.satucelah-0.1,t=>{const k=P(t,K.satucelah,2.6);return side(9.6,1.8,1.0,cl(0.5,-0.3,k));}],
   [K.masalah-0.1,t=>{const k=P(t,K.masalah,3.2);const g=gNew[0];return [g.clone().addScaledVector(out,5.0).add(V(0,1.7-0.3*k,0)),g.clone().setY(-0.05)];}],
   [K.plak-0.1,t=>{const k=P(t,K.plak,1.1);const g=gNew[1];return [g.clone().addScaledVector(out,4.8).add(V(0,1.6,0)),g.clone().setY(-0.05)];}],
   [K.gigitan-0.1,t=>side(8.6,1.1,1.1,0.0)],
   [K.nggak-0.1,t=>{const k=ease(P(t,K.nggak,2.4));return [V(cl(lw.x+7,9,k),cl(2.5,10,k),cl(lw.z+4,9,k)),V(cl(lw.x,0,k),cl(-0.3,-0.8,k),cl(lw.z,0,k))];}],
   [K.good,t=>{const k=P(t,K.good,2.6);return side(9.4,1.6,1.0,cl(-0.8,0.6,k));}],
   [K.s1,t=>{const k=P(t,K.s1,4.8);return [S(-1.6+0.8*k,1.8,13.5),S(0,0.6,1.2)];}],
   [K.psa-0.1,t=>{const k=P(t,K.psa,4.6);return [S(1.4-0.6*k,-0.6,14.0),S(0,-0.9,1.2)];}],
   [K.pakai-0.1,t=>{const k=P(t,K.pakai,2.2);return [S(-0.8,2.0,12.5-1.2*k),S(0,0.8,1.2)];}],
   [K.s2,t=>{const k=P(t,K.s2,2.2);return side(9.0,1.6,1.0,cl(-0.6,0.2,k));}],
   [K.isi-0.1,t=>{const k=P(t,K.isi,4.4);return side(8.2,1.3,1.0,cl(0.4,-0.3,k));}],
   [K.s3,t=>{const k=ease(P(t,K.s3,2.3));const g=gNew[0];const tan=V(-out.z,0,out.x);return [g.clone().addScaledVector(out,cl(5.8,4.9,k)).add(V(0,cl(2.3,1.7,k),0)).addScaledVector(tan,cl(-0.7,0.5,k)),g.clone().setY(-0.05)];}],
   [K.bersih-0.1,t=>{const g=gNew[0];const k=P(t,K.bersih,3.8);const tan=V(-out.z,0,out.x);return [g.clone().addScaledVector(out,4.6).add(V(0,1.5,0)).addScaledVector(tan,cl(0.8,-0.5,k)),g.clone().setY(-0.05)];}],
   [K.ingat,t=>{const k=ease(P(t,K.ingat,5));const a=0.55-0.75*k;return [V(Math.sin(a)*17,cl(3.0,4.2,k),Math.cos(a)*17),V(0,0.1,0)];}],
  ];
  let si=0;for(let i=0;i<shots.length;i++)if(T>=shots[i][0])si=i;
  let [cp,lk]=shots[si][1](T);
  const hard=[1,3,10,11,14,16,18];
  if(si>0&&!hard.includes(si)){const blv=ease(P(T,shots[si][0],0.75));if(blv<1){const [pp,pl]=shots[si-1][1](T);cp=pp.clone().lerp(cp,blv);lk=pl.clone().lerp(lk,blv);}}
  cam.position.copy(cp);cam.lookAt(lk);cam.updateMatrixWorld();
  // mood
  const dim=P(T,K.masalah,1.0)*(1-P(T,K.good,0.6));const warm=P(T,K.good,0.8);
  scene.background.set('#F4EFE6').lerp(new THREE.Color('#E4DDD1'),dim).lerp(new THREE.Color('#F9F3E9'),warm);
  ground.material.color.set('#EEE7DB').lerp(new THREE.Color('#DFD7CA'),dim).lerp(new THREE.Color('#F4EDE2'),warm);
  hemi.intensity=1.25-0.25*dim+0.15*warm;sun.intensity=2.0-0.3*dim+0.4*warm;
  sun.position.set(6,20+(sec?SY:0),10);sun.target.position.set(0,sec?SY:0,0);sun.target.updateMatrixWorld();
  R.render(scene,cam);
  // ---------- tags ----------
  tg.forEach(e=>e.style.display='none');
  const top=t=>wpos(t).add(V(0,t.upper?-1.0:1.1,0));
  if(T<K.kok){tag(0,'dicabut',lp.clone().setY(1.6),T,K.cabut+0.3,K.tiga-0.1,-20);}
  if(T>=K.gigijuga+0.55&&T<K.masalah){
    tag(0,'miring',top(nA),T,K.kirikanan+0.8,K.satucelah-0.1,-40);tag(1,'miring',top(nB),T,K.kirikanan+1.0,K.satucelah-0.1,-40);
    tag(2,'turun',wpos(opp).add(V(0,-0.2,0)),T,K.turun+0.3,K.masalah-0.1,-60);}
  if(T>=K.masalah&&T<K.good){tag(0,'celah baru',gNew[0].clone().setY(1.0),T,K.masalah+0.6,K.sisa-0.1,-40);
    if(T>=K.gigitan)tag(1,'gigitan berubah',wpos(opp).add(V(0,0.4,0)),T,K.gigitan+0.2,K.nggak-0.1,-60);}
  if(sec){tag(0,'saraf meradang',S(0,0.2,FZ),T,K.rawat,K.yaitu-0.1,-40);tag(1,'dibersihkan & diisi',S(0,-1.2,FZ),T,K.yaitu+0.6,K.pakai-0.1,-40);tag(2,'gigi tetap dipakai',S(0,2.8,FZ),T,K.pakai+0.5,K.s2-0.1,-40);}
  if(T>=K.s2&&T<K.s3){tag(0,'gigi pengganti',lp.clone().setY(0.1),T,K.isi+1.3,K.s3-0.1,10);if(T>=K.ruang)tag(1,'nggak ada ruang miring',lp.clone().setY(2.6),T,K.ruang+0.8,K.s3-0.1,-30);}
  if(T>=K.s3&&T<K.ingat)tag(0,'sikat sela gigi',gNew[0].clone().setY(1.0),T,K.bersih+0.2,K.ingat-0.1,-50);
  // numbers
  num.style.display=T<K.card?'block':'none';
  if(T<K.cabut)setNum('','',T,0);
  else if(T<K.tiga)setNum('1','gigi dicabut',T,K.cabut);
  else if(T<K.kok)setNum('3','gigi terdampak',T,K.tiga);
  else if(T<K.tigageser)setNum('','',T,0);
  else if(T<K.masalah)setNum('3','gigi bergeser',T,K.tigageser);
  else if(T<K.s1)setNum('','',T,0);
  else if(T<K.s2)setNum('1','jangan buru-buru cabut',T,K.s1);
  else if(T<K.s3)setNum('2','isi celahnya',T,K.s2);
  else if(T<K.ingat)setNum('3','bersihkan sela',T,K.s3);
  else setNum('','',T,0);
  kineticSub(sub,T,SUBS,WORDS);
  card.style.display=T>=K.card?'flex':'none';card.style.opacity=P(T,K.card,0.5);
  // flashes at set changes
  let fo=T<0.3?1-P(T,0,0.3):0;
  for(const c of [K.kok,K.gigijuga+0.55,K.good,K.s1,K.s2,K.s3,K.ingat]){if(T>=c-0.3&&T<c+0.5){fo=Math.max(fo,T<c?ease(P(T,c-0.3,0.3)):1-ease(P(T,c,0.5)));}}
  fade.style.background='#FBF8F3';fade.style.opacity=fo;
};
await document.fonts.load('200 230px Outfit');await document.fonts.load('700 62px Outfit');await document.fonts.load('600 44px Outfit');

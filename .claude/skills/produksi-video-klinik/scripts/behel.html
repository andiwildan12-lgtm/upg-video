  if(T<K.t1)tag(0,'behel',bracketPos(crowd).add(V(0,0.5,0)),T,1.2,K.t1-0.05,-50);
  else if(T<K.t2)tag(0,'dorongan kecil, terus-menerus',crowd.base.clone().setY(1.5),T,K.s1t+0.8,K.t2-0.05,-60);
  else if(DIO){
    if(T<K.bantal)tag(0,'tulang',D(-1.6,0.6,0.7),T,K.t2+0.6,K.bantal-0.05,-30);
    else if(T<K.tekan)tag(0,'“bantalan”',D(0.45,-0.8,0.6),T,K.bantal+0.6,K.tekan-0.05,-40);
    else if(T<K.tarik)tag(0,'tertekan → tulang diurai',D(-0.6,1.0,0.7),T,K.tekan+0.6,K.tarik-0.05,-40);
    else tag(0,'tertarik → tulang baru',D(0.35,1.0,0.7),T,K.tarik+0.6,K.rumah-0.05,-40);}
  else if(HOUSE){
    if(T<K.belakang)tag(0,'dibongkar',H(-1.25,2.1,0.5),T,K.depan+0.2,K.belakang-0.05,-40);
    else if(T<K.mm)tag(0,'dibangun',H(0.75,2.1,0.5),T,K.belakang+0.2,K.mm-0.05,-40);
    else tag(0,'± 1 mm / bulan',H(-0.5,2.6,0),T,K.mm+0.2,K.t3-0.05,-60);}
  else if(T<K.kontrol)tag(0,'dorongan melemah',crowd.base.clone().setY(1.5),T,K.t3+0.8,K.kontrol-0.05,-60);
  else if(T>=K.s1&&T<K.s2)tag(0,'kawat disetel / diganti',bracketPos(crowd).add(V(0,0.6,0)),T,K.s1+0.6,K.s2-0.05,-60);
  else if(T>=K.s2&&T<K.s3)tag(0,'braket lepas → dicek',bracketPos(loose).add(V(0,0.6,0)),T,K.s2+0.6,K.s3-0.05,-60);
  else if(T>=K.s3&&T<K.telat)tag(0,T<K.kencang?'dorongan pelan ✓':'terlalu kencang ✗',crowd.base.clone().setY(1.5),T,T<K.kencang?K.s3+0.6:K.kencang+0.2,T<K.kencang?K.kencang-0.05:K.telat-0.05,-60);
  // meter (tahap 3)
  if(T>=K.t3&&T<K.kontrol){met.style.display='block';met.style.opacity=Math.min(P(T,K.t3+0.3,0.3),1-P(T,K.kontrol-0.3,0.3));document.getElementById('mbar').style.width=(100-70*weak)+'%';document.getElementById('coil').setAttribute('transform',`scale(${1+0.9*weak},1)`);document.getElementById('coil').style.opacity=P(T,K.per,0.3);}
  // graph panel (kontrol intro + telat)
  const gA=T>=K.kontrol&&T<K.s1, gB=T>=K.telat&&T<K.cta;
  if(gA||gB){const t0=gA?K.kontrol:K.telat,t1=gA?K.s1:K.cta;const o=Math.min(P(T,t0,0.35),1-P(T,t1-0.35,0.35));graf.style.display='block';graf.style.opacity=o;cvs.style.filter=`blur(${8*o}px)`;
    const st=document.getElementById('steps');const len=1400;st.style.strokeDasharray=len;st.style.strokeDashoffset=len*(1-ease(P(T,K.kontrol+0.3,2.2)));
    const fl=document.getElementById('flat');fl.style.opacity=gB?1:0;fl.style.strokeDasharray=600;fl.style.strokeDashoffset=600*(1-ease(P(T,K.telat+0.6,1.5)));
    const tg2=document.getElementById('tgt');tg2.setAttribute('transform',`translate(${gB?110*ease(P(T,K.telat+2.2,1.2)):0},0)`);document.getElementById('lama').style.opacity=gB?P(T,K.telat+2.8,0.4):0;
    document.getElementById('gt').textContent=gB?'Kalau telat kontrol':'Progres behel';}
  // CTA
  if(T>=K.cta&&T<K.card){const o=Math.min(P(T,K.cta+1.5,0.35),1-P(T,K.card-0.3,0.3));cta.style.display='block';cta.style.opacity=o;cvs.style.filter=`blur(${10*o}px)`;cta.style.transform=`translateY(${(1-ease(P(T,K.cta+1.5,0.5)))*40}px)`;
    const cs=['c1','c2','c3'].map(i=>document.getElementById(i));cs.forEach((c,i)=>{const t0=K.tulis+0.1+i*0.45;c.style.opacity=P(T,t0,0.15);c.style.transform=`scale(${0.6+0.4*back(P(T,t0,0.35))})`;const on=Math.floor(Math.max(0,T-K.tulis-1.6)/0.7)%3===i&&T>=K.tulis+1.6;c.className='chip'+(on?' on':'');});
    if(T>=K.follow){fol.style.display='block';fol.style.opacity=o*P(T,K.follow,0.3);fol.querySelector('.bt').style.transform=`scale(${0.6+0.4*back(P(T,K.follow,0.4))})`;fol.querySelector('.nx').style.opacity=P(T,K.follow+0.5,0.4);}}
  // numbers
  num.style.display=(T<K.cta&&!gA&&!gB)?'block':'none';
  if(T>=K.s1t&&T<K.t2)setNum('1','tahap · dorongan kawat',T,K.s1t);
  else if(DIO)setNum('2','tahap · tulang',T,K.t2);
  else if(T>=K.t3&&T<K.kontrol)setNum('','',T,0);
  else if(T>=K.s1&&T<K.s2)setNum('1','saat kontrol',T,K.s1);
  else if(T>=K.s2&&T<K.s3)setNum('2','saat kontrol',T,K.s2);
  else if(T>=K.s3&&T<K.telat)setNum('3','saat kontrol',T,K.s3);
  else setNum('','',T,0);
  kineticSub(sub,T,SUBS,WORDS);
  card.style.display=T>=K.card?'flex':'none';card.style.opacity=P(T,K.card,0.5);
  let fo=T<0.3?1-P(T,0,0.3):0;
  for(const c of [K.t2,K.rumah,K.t3]){if(T>=c-0.3&&T<c+0.5)fo=Math.max(fo,T<c?ease(P(T,c-0.3,0.3)):1-ease(P(T,c,0.5)));}
  fade.style.background='#FBF8F3';fade.style.opacity=fo;
};

await document.fonts.load('200 230px Outfit');await document.fonts.load('700 62px Outfit');await document.fonts.load('600 44px Outfit');await document.fonts.load('800 54px Outfit');
window.ready=true;
</script></body></html>

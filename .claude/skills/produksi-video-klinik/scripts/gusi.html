 const handle=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.09,12,40,Math.PI),new THREE.MeshStandardMaterial({color:'#A9BFA6',roughness:0.5}));handle.position.set(-1.35,1.4,0);handle.rotation.z=Math.PI/2;potG.add(handle);
 const water=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.12,1.6,48),new THREE.MeshStandardMaterial({color:'#BFE6E2',transparent:true,opacity:0.45,depthWrite:false}));water.position.y=0.85;potG.add(water);
 const base=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,0.04,48),new THREE.MeshStandardMaterial({color:'#E9E4DA'}));base.position.y=0.02;potG.add(base);}
const crustM=new THREE.MeshStandardMaterial({color:'#FBFAF6',roughness:1,flatShading:true});
const crust=[];for(let i=0;i<70;i++){const a=i*2.399,r=0.15+1.0*Math.sqrt((i%35)/35);const m=new THREE.Mesh(new THREE.IcosahedronGeometry(0.09+0.04*(i%3),0),crustM);m.position.set(Math.cos(a)*r,0.08+0.05*(i%4),Math.sin(a)*r);m.scale.setScalar(0.001);m.userData={d:(i%35)/35};potG.add(m);crust.push(m);}

// ================= OVERLAY =================
const nv=document.getElementById('nv'),nl=document.getElementById('nl'),num=document.getElementById('num'),sub=document.getElementById('sub'),card=document.getElementById('card'),fade=document.getElementById('fade');

const tg=[document.getElementById('tg1'),document.getElementById('tg2')];
let K={},SUBS=[],WORDS=[];window.setup=o=>{K=o.K;SUBS=o.subs;WORDS=o.words||[];};
function setNum(v,l,T,t0){num.style.opacity=v===''?0:Math.min(1,P(T,t0,0.25));nv.textContent=v;nl.textContent=l;}

function tag(i,html,world,T,t0,t1,dy=-30){const el=tg[i];if(T<t0||T>=t1){el.style.display='none';return;}el.style.display='block';el.innerHTML=html;const [x,y]=scr(world);
  el.style.left=Math.max(260,Math.min(W-260,x))+'px';let yy=y+dy;if(yy>980&&yy<1300)yy=yy<1140?975:1420;el.style.top=yy+'px';el.style.opacity=Math.min(P(T,t0,0.25),1-P(T,t1-0.25,0.25));}

window.render=function(T){
  const pot=T>=K.teko&&T<K.sikatkarang;
  const closeShot=T<K.ingat;teeth.forEach(t=>{t.g.visible=!(closeShot&&(t.side!==1||t.k<3));});
  potG.visible=pot;archG.visible=!pot;
  const C=mid.clone();
  // ---------- states ----------
  const clean=T>=K.good;                  // after "kabar baiknya" story resets progressively by steps
  let plaq=0,tart=0,infl=0;
  if(T<K.kok){plaq=0.9;tart=1;infl=1;}
  else if(!clean){plaq=ease(P(T,K.plak,1.2));tart=ease(P(T,K.karang,1.6));infl=ease(P(T,K.radang,1.2));if(T>=K.masalah)tart=1+0.25*ease(P(T,K.masalah,2.5));}
  else{tart=1.25*(1-ease(P(T,K.s3+0.8,2.2)));plaq=0.9*(1-ease(P(T,K.s1+0.6,1.5)));infl=1-ease(P(T,K.rutin,2.5));if(T>=K.ingat){tart=0;plaq=0;infl=0;}}
  bandM.opacity=Math.min(0.92,Math.max(plaq*0.8,tart>0?0.95:0));
  bandM.color.set('#E6C463').lerp(new THREE.Color('#A39C8E'),Math.min(1,tart));
  bands.forEach(b=>{const s=1.035+0.05*Math.min(1.25,tart);b.scale.set(s,1,s*b.userData.zs);b.visible=bandM.opacity>0.01;});
  bandM.clippingPlanes[0].constant=0.4+0.06*Math.min(1.25,tart);
  chunks.forEach((c,i)=>{c.scale.setScalar(Math.max(0.001,Math.min(1.3,tart)*(0.8+0.4*((i*5)%3)/2)));});
  paintGum(infl);

  food.forEach(m=>{const t0=K.t1+0.6+m.userData.d;const vis=T>=t0&&T<K.plak+1.2&&!pot;m.visible=vis;if(!vis)return;const k=ease(P(T,t0,0.5));m.position.copy(m.userData.tgt).add(V(0,1.6*(1-k),0.3*(1-k)));m.scale.setScalar(1-P(T,K.plak+0.4,0.8));});
  // bacteria
  bac.forEach((m,i)=>{const vis=(T>=K.kuman&&T<K.t2+0.5)||(T>=K.masalah&&T<K.good);m.visible=vis&&!pot;if(!vis)return;const t0=T>=K.masalah?K.masalah:K.kuman;const k=ease(P(T,t0+(i%6)*0.08,0.9));
    m.position.copy(m.userData.tgt).add(V(Math.sin(T*3+m.userData.ph)*0.04+(1-k)*Math.sin(i)*1.2,(1-k)*1.0,(1-k)*0.8));});
  // minerals into plaque
  mins.forEach(m=>{const t0=K.menyerap+m.userData.d;const vis=T>=t0&&T<K.karang+0.8&&!pot;m.visible=vis;if(!vis)return;const k=ease(P(T,t0,0.7));m.position.copy(m.userData.tgt).add(V(0,1.2*(1-k),0.6*(1-k)));m.scale.setScalar(1-P(T,K.karang+0.2,0.5));m.rotation.y=T*4;});
  // new plaque on rough tartar
  newPl.forEach(m=>{const t0=K.kasar+0.4+m.userData.d;const vis=T>=t0&&T<K.good&&!pot;m.visible=vis;if(!vis)return;const k=back(P(T,t0,0.4));m.position.copy(m.userData.tgt);m.scale.setScalar(Math.max(0.001,k));});
  // blood
  blood.forEach((m,i)=>{const t0=K.darah+0.5+i*0.15;const vis=(T>=t0&&T<K.masalah)||(T<K.kok&&T>0.8+i*0.15);m.visible=vis&&!pot;if(!vis)return;const k=back(P(T,T<K.kok?0.8+i*0.15:t0,0.35));m.position.copy(m.userData.tgt).add(V(0,-0.06*P(T,(T<K.kok?0.8:t0)+0.5,1.5),0));m.scale.set(Math.max(0.001,k),Math.max(0.001,k*1.2),Math.max(0.001,k));});
  // brush passes
  brush.visible=false;
  const fr=front.slice();
  const pass=(a,d,tilt,y,avoid=false)=>{if(T<a||T>a+d)return;const k=(T-a)/d;const t=fr[Math.min(fr.length-1,Math.floor(k*fr.length))];const nrm=V(t.p.x,0,t.p.z).sub(V(0,0,-0.4)).normalize();
    brush.visible=true;const off=(avoid?0.9+0.25*Math.sin(T*3):0.38)+t.d*0.5;brush.position.copy(t.p).addScaledVector(nrm,off).setY(y+0.04*Math.sin(T*30));brush.rotation.set(0,Math.atan2(nrm.x,nrm.z),0);brush.rotateX(-tilt);};
  if(T<K.kok)pass(0.0,1.2,0.0,0.75);
  pass(K.sikatkarang+0.1,2.0,0.0,0.7);
  pass(K.darah,0.6,0.0,0.55);
  pass(K.masalah+0.3,2.2,0.0,0.95,true);
  pass(K.s1+0.2,2.6,0.75,0.45);
  // floss
  floss.visible=T>=K.s2+0.2&&T<K.s3;if(floss.visible){const k=ease(P(T,K.s2+0.2,0.6));floss.position.copy(C).addScaledVector(outN,0.3).setY(cl(2.2,1.05,k)+0.16*Math.sin((T-K.s2)*8)*P(T,K.s2+0.9,0.2));floss.rotation.set(0,0,0);}
  // scaler + crumbs
  scaler.visible=T>=K.s3&&T<K.rutin;if(scaler.visible){const tt=fr[2];const nrm=V(tt.p.x,0,tt.p.z).sub(V(0,0,-0.4)).normalize();const k=ease(P(T,K.s3,0.7));const sweep=P(T,K.s3+0.8,2.2);
    const tp=fr[Math.min(fr.length-1,Math.floor(sweep*fr.length))].p;scaler.position.copy(tp).addScaledVector(nrm,0.55+(1-k)*1.5).setY(0.36+0.012*Math.sin(T*160)+(1-k)*1.0);const dir=V(0,1,0).multiplyScalar(0.85).addScaledVector(nrm,0.45).add(V(0.25,0,0)).normalize();scaler.quaternion.setFromUnitVectors(V(0,1,0),dir);}
  crumbs.forEach((c,i)=>{const t0=K.s3+0.9+c.userData.d;if(T<t0||T>t0+1.6){c.visible=false;return;}c.visible=true;const u=T-t0;const v=c.userData.v;c.position.copy(fr[i%fr.length].p).addScaledVector(outN,0.5).add(V(v.x*u,0.35+v.y*u-2.0*u*u,v.z*u));});
  // teapot crust & specks
  if(pot){const g=ease(P(T,K.teko+0.2,1.8));crust.forEach(m=>{m.scale.setScalar(Math.max(0.001,back(P(g,m.userData.d*0.7,0.3))));});
    specks.forEach(m=>{const ph=((T*0.6+m.userData.ph)%1);m.position.set(m.userData.x*0.9,1.5-1.4*ph,m.userData.z*0.9);m.visible=true;});}
  // ---------- camera ----------
  const at=(o,h,dist,side=0)=>{const tan=V(-outN.z,0,outN.x);return C.clone().addScaledVector(outN,dist*1.3+0.3).addScaledVector(tan,side).setY(h+0.15);};
  const L=(h)=>C.clone().setY(h-0.3);
  const PT=V(30,0,0);
  const shots=[
   [0,t=>{const k=P(t,0,K.kok);return [at(0,cl(1.0,0.85,k),cl(4.6,4.0,k),cl(-0.6,0.2,k)),L(0.42)];}],
   [K.t1-0.1,t=>{const k=P(t,K.t1,4);return [at(0,cl(1.2,0.95,k),cl(4.4,3.6,k),cl(0.8,0.3,k)),L(0.45)];}],
   [K.plak-0.1,t=>{const k=P(t,K.plak,3);return [at(0,0.8,3.5,cl(-0.6,-0.1,k)),L(0.4)];}],
   [K.t2-0.1,t=>{const k=P(t,K.t2,4);return [at(0,cl(1.3,1.0,k),cl(4.2,3.6,k),cl(0.7,0.2,k)),L(0.42)];}],
   [K.teko,t=>{const k=P(t,K.teko,2.4);return [PT.clone().add(V(cl(1.6,0.8,k),cl(6.4,5.6,k),cl(10.5,9.4,k))),PT.clone().add(V(0,0.6,0))];}],
   [K.sikatkarang,t=>{const k=P(t,K.sikatkarang,2.4);return [at(0,1.2,cl(5.0,4.6,k),cl(-0.4,0.3,k)),L(0.45)];}],
   [K.t3-0.1,t=>{const k=P(t,K.t3,3);return [at(0,cl(0.7,0.62,k),cl(2.8,2.3,k),cl(0.4,0.0,k)),L(0.38)];}],
   [K.radang-0.1,t=>{const k=P(t,K.radang,3);return [at(0,0.9,cl(4.0,3.6,k),cl(-0.5,0.1,k)),L(0.38)];}],
   [K.darah-0.1,t=>{const k=P(t,K.darah,2.5);return [at(0,0.7,cl(3.2,2.9,k),cl(0.4,0.1,k)),L(0.38)];}],
   [K.masalah-0.1,t=>{const k=P(t,K.masalah,4);return [at(0,cl(1.8,2.3,k),cl(5.6,6.4,k),0),L(0.4)];}],
   [K.good,t=>{const k=P(t,K.good,3);return [at(0,1.6,cl(6.2,5.4,k),cl(-0.8,0.6,k)),L(0.45)];}],
   [K.s1-0.1,t=>{const k=P(t,K.s1,3.4);return [at(0,1.0,4.2,cl(1.4,0.4,k)),L(0.4)];}],
   [K.s2-0.1,t=>{const k=P(t,K.s2,2.8);return [at(0,1.0,cl(3.6,3.2,k),cl(-0.3,0.2,k)),L(0.55)];}],
   [K.s3-0.1,t=>{const k=P(t,K.s3,3);return [at(0,0.9,cl(3.8,3.4,k),cl(0.6,-0.4,k)),L(0.4)];}],
   [K.rutin-0.1,t=>{const k=P(t,K.rutin,4);return [at(0,1.4,5.6,cl(-0.6,0.6,k)),L(0.45)];}],
   [K.ingat-0.1,t=>{const k=ease(P(t,K.ingat,9));const a=-0.25+0.5*k;return [V(Math.sin(a)*0.5,cl(24,26,k),-0.1+Math.cos(a)*0.5),V(0,0,-0.4)];}],
  ];
  let si=0;for(let i=0;i<shots.length;i++)if(T>=shots[i][0])si=i;

  else if(T<K.masalah)tag(0,'berdarah',ge.clone().setY(0.25),T,K.darah+0.6,K.masalah-0.1,-90);
  else if(T<K.good)tag(0,'kuman makin banyak',ge.clone().setY(1.0),T,K.masalah+1.2,K.good-0.1,-60);
  else if(T>=K.s1&&T<K.s2)tag(0,'miring ke tepi gusi',ge.clone().setY(0.9),T,K.s1+0.8,K.s2-0.1,-60);
  else if(T>=K.s2&&T<K.s3)tag(0,'benang gigi',ge.clone().setY(1.2),T,K.s2+0.8,K.s3-0.1,-60);
  else if(T>=K.s3&&T<K.rutin)tag(0,'scaling',ge.clone().setY(1.0),T,K.s3+0.8,K.rutin-0.1,-80);
  // clock "beberapa jam"
  if(T>=K.jam&&T<K.t2){clock.style.display='block';clock.style.left='455px';clock.style.top='330px';clock.style.opacity=Math.min(P(T,K.jam,0.25),1-P(T,K.t2-0.3,0.3));clock.style.transform=`scale(${back(P(T,K.jam,0.4))})`;
    document.getElementById('ch1').setAttribute('transform',`rotate(${(T-K.jam)*300} 50 50)`);document.getElementById('ch2').setAttribute('transform',`rotate(${(T-K.jam)*25} 50 50)`);}

};

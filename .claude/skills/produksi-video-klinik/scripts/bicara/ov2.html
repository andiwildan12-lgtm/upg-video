<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:M;src:url(fonts/montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:M;src:url(fonts/montserrat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:M;src:url(fonts/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:M;src:url(fonts/montserrat-latin-800-normal.woff2);font-weight:800}
*{box-sizing:border-box;margin:0}body{width:1080px;height:1920px;position:relative;overflow:hidden;background:transparent;font-family:M,sans-serif;color:#354B49}
.fb{position:absolute;left:0;right:0;bottom:0;height:480px;background:linear-gradient(to bottom,rgba(232,248,246,0) 0%,rgba(232,248,246,.96) 32%,#E8F8F6 100%)}
.sub{position:absolute;left:80px;right:80px;bottom:1300px;text-align:center}
.sub span{display:inline-block;font:700 60px/1.15 M;color:#354B49;background:rgba(255,255,255,.95);padding:12px 26px 16px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.sub b{font-weight:800;background:#28CDBD;color:#354B49;padding:0 12px 4px;border-radius:10px}
.ov{position:absolute;left:80px;right:80px;top:300px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.ov .a{font:800 62px/1 M;color:#354B49;background:#fff;padding:16px 26px 20px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.ov .b{font:700 40px/1.1 M;color:#354B49;background:#28CDBD;padding:12px 22px 15px;border-radius:12px}
.cm{position:absolute;right:80px;bottom:1345px;width:660px;background:#fff;border-radius:26px;padding:22px 28px 26px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.cm .hd{display:flex;align-items:center;gap:14px;font:500 28px M;color:#7A8784}
.cm .av{width:44px;height:44px;border-radius:50%;background:#D9E3E1}
.cm .tx{font:700 46px/1.25 M;color:#354B49;margin-top:10px}
.cm.nt:after{display:none}
.cm:after{content:'';position:absolute;right:120px;bottom:-26px;border-left:22px solid transparent;border-right:22px solid transparent;border-top:28px solid #fff}
#card{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:310px;text-align:center}
</style></head><body><div id=root></div>
<script>
window.setState=(o)=>{let h='';
if(o.fb)h+='<div class=fb></div>';
if(o.cm)h+=`<div class="cm${o.nt?" nt":""}" style="${o.cmTop?"top:"+o.cmTop+"px;bottom:auto;right:80px;left:80px;width:auto":""}"><div class=hd><div class=av></div>Balas komentar</div><div class=tx>${o.cm}</div></div>`;
if(o.ov)h+='<div class=ov>'+o.ov.split('|').map((x,i)=>`<div class=${i?'b':'a'}>${x}</div>`).join('')+'</div>';
if(o.sub){let t=o.sub;if(o.key)t=t.replace(o.key,`<b>${o.key}</b>`);h+=`<div class=sub><span>${t}</span></div>`;}
if(o.card)h+=`<div id=card><img src="../card_logo.png" style="width:300px">
<div style="font:700 88px/1 M;margin-top:34px;letter-spacing:-1px">Behel</div>
<div style="font:500 38px M;color:#7A8784;margin-top:18px">mulai</div>
<div style="font:800 98px/1.02 M;letter-spacing:-1px">Rp6 jutaan</div>
<div style="font:600 38px M;margin-top:10px">atas &amp; bawah · Rp3 jt per rahang</div>
<div style="font:700 38px M;background:#28CDBD;padding:10px 24px 14px;border-radius:12px;margin-top:20px">cicilan Rp2 jt/bln × 3 · tanpa bunga</div>
<div style="font:500 30px/1.5 M;margin-top:28px;max-width:880px">sudah termasuk: pemasangan atas &amp; bawah · scaling · cetak gigi · foto intra &amp; ekstra oral · konsultasi dokter gigi · ortho kit</div>
<div style="font:600 36px/1.45 M;margin-top:28px">Jl. Rusa No. 65, Maricaya, Makassar<br>WA 0898-7735-463</div></div>`;
document.getElementById('root').innerHTML=h;}
</script></body></html>

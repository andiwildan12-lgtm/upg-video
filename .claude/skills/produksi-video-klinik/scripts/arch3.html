    if(T<K.hide&&p.type!=='prox'){op=0.6*P(T,K.glow-0.8,0.4)*(1-P(T,K.glow,0.4));col=C_W;}
    if(T>=K.hide){
    if(p.tooth===target){const idx=p.tooth.plates.indexOf(p);op=Math.max(op,P(T,K.t5+0.35+idx*0.28,0.15)*(1-P(T,K.t160+0.2,0.4)));}
    const lit=P(T,K.t160+0.3+(i%160)*0.006,0.15);op=Math.max(op,lit*0.85);
    if(T>K.brush){const kb=P(T,K.brush+0.15+(p.tooth.s%6)/6*1.2,0.25);if(p.type!=='prox'){col=C_T.clone().lerp(C_W,kb);op=cl(op,0.0,kb*0.9);}else{op=cl(op,0.25,kb);col=C_D;}}
    if(T>K.sisa&&p.type==='prox'){const pulse=0.75+0.25*Math.sin((T-K.sisa)*7);op=cl(0.25,pulse,P(T,K.sisa,0.4));col=C_T;}
    if(T>K.plak&&p.type==='prox'){op*=1-P(T,K.plak,0.6);}
    if(T>K.end){op=(p.type==='prox'?0.85:0.5)*P(T,K.end+0.3,0.8);col=p.type==='prox'?C_T:C_W;}}
    p.mesh.material.color.copy(col);p.mesh.material.opacity=op;});
  // plaque & tartar
  blobs.forEach(b=>{let s=back(P(T,K.plak+b.r*0.8,0.4));const hard=P(T,K.karang,0.6);
    b.m.position.copy(b.m.userData.p0);
    b.m.material.color.set('#E6C463').lerp(new THREE.Color('#9E978B'),b.hard?hard:0);
    if(!b.hard&&T>K.fl_in)s*=1-P(T,(b===fb?K.fl_ud:K.fl_rep)+b.r*0.9,0.3);
    if(b.hard&&b!==hb&&T>K.end)s*=1-P(T,K.end+b.r*1.0,0.4);
    if(b===hb&&T>K.sc_crumble)s*=1-ease(P(T,K.sc_crumble,2.4));
    const sv=Math.max(0.0001,s);b.m.scale.setScalar(sv);if(b.hard&&hard>0.01)b.m.scale.multiply(new THREE.Vector3(1+0.25*hard,1-0.2*hard,1+0.25*hard));});
  // crumbs
  crumbs.forEach((c,i)=>{const t0=K.sc_crumble+c.userData.d;if(T<t0||T>t0+2.2){c.visible=false;return;}c.visible=true;const u=T-t0;const v=c.userData.v;c.position.copy(hMid).add(new THREE.Vector3(v.x*u,v.y*u-2.2*u*u+0.1,v.z*u));c.scale.setScalar(1-u/2.4);});
  mist.forEach((m,i)=>{if(T<K.sc_vib||T>K.sc_crumble+2.6){m.visible=false;return;}m.visible=true;const ph=((T*1.7+i/mist.length)%1);m.position.copy(tipPos).add(new THREE.Vector3(Math.sin(i*2.3)*ph*0.6,0.1+ph*0.5,Math.cos(i*1.7)*ph*0.6));m.material.opacity=0.5*(1-ph);m.scale.setScalar(0.4+ph);});
  // brush passes
  const pass=(a,d)=>{if(T<a||T>a+d){return false;}const k=(T-a)/d;const up=teeth.filter(t=>t.arch===-1).sort((x,y)=>x.s-y.s);const idx=Math.min(up.length-1,Math.floor(k*up.length));const t=up[idx];brush.position.copy(t.p).add(new THREE.Vector3(0,0.15,0));brush.rotation.y=t.g.rotation.y+Math.PI/2;brush.position.y+=0.05*Math.sin(T*40);return true;};
  brush.visible=pass(K.brush0,1.8)||pass(K.brush,1.8)||pass(K.brush2,1.6);
  // floss technique
  flLine.visible=false;flVert.visible=false;flC.visible=false;coils.forEach(c=>c.visible=false);floss.visible=false;
  if(T>=K.fl_len&&T<K.fl_in){flLine.visible=true;const k=ease(P(T,K.fl_len,0.8));flLine.scale.set(1,Math.max(0.001,k),1);
    if(T>=K.fl_coil){coils.forEach(c=>{c.visible=true;c.scale.setScalar(Math.max(0.001,back(P(T,K.fl_coil,0.4))));});}}
  if(T>=K.fl_in&&T<K.fl_rep){flVert.visible=true;const k=ease(P(T,K.fl_in,1.4));flVert.position.set(gMid.x,cl(2.6,1.0,k),gMid.z);}
  if(T>=K.fl_c&&T<K.fl_rep){flC.visible=true;const k=ease(P(T,K.fl_c,0.8));flC.scale.set(1,1,1);flC.material.opacity=k;
    let y=0.6;if(T>=K.fl_ud)y=0.55+0.3*Math.sin((T-K.fl_ud)*Math.PI*2*1.3);flC.position.y=y;}
  if(T>=K.fl_rep&&T<K.fl_rep+1.0){const k=(T-K.fl_rep)/1.0;const gp=gaps[Math.min(gaps.length-1,Math.floor(k*gaps.length))];const p=gp.a.p.clone().add(gp.b.p).multiplyScalar(0.5);floss.visible=true;floss.position.set(p.x,0.9-0.5*Math.abs(Math.sin(T*18)),p.z);floss.rotation.set(0,0,Math.PI/2);floss.rotation.y=gp.a.g.rotation.y;}
  // scaler tool
  scaler.visible=T>=K.sc_tool&&T<K.end+0.3;if(scaler.visible){const k=ease(P(T,K.sc_tool,0.9));scaler.position.copy(tipPos).addScaledVector(scDir,(1-k)*2.5);if(T>K.sc_vib){scaler.position.x+=Math.sin(T*170)*0.015;scaler.position.z+=Math.cos(T*150)*0.015;}if(T>K.end)scaler.position.addScaledVector(scDir,P(T,K.end,0.3)*3);}
  sun.intensity=2.0+0.5*P(T,K.good,1.0);
  R.render(scene,cam);
  // tags
  tag.style.display='none';
  if(T>=K.fl_len+0.4&&T<K.fl_in){tag.style.display='block';tag.textContent='±40 cm';tag.style.opacity=P(T,K.fl_len+0.4,0.3);}
  if(T>=K.fl_c+0.3&&T<K.fl_ud+1.4){tag.style.display='block';tag.textContent='bentuk huruf C';tag.style.opacity=P(T,K.fl_c+0.3,0.3);}
  if(T>=K.sc_vib&&T<K.end){tag.style.display='block';tag.textContent='alat bergetar';tag.style.opacity=P(T,K.sc_vib,0.3);}
  // numbers
  num.style.display=T<K.card?'block':'none';
  if(T<K.glow)setNum('','',T,0);
  else if(T<K.kok)setNum('40%','permukaan nggak kesentuh sikat',T,K.glow);
  else if(T<K.t32)setNum('','',T,0);
  else if(T<K.t5)setNum(String(Math.round(32*P(T,K.t32,1.1))),'gigi',T,K.t32);
  else if(T<K.t160)setNum('5','sisi per gigi',T,K.t5);
  else if(T<K.brush)setNum(String(Math.round(160*ease(P(T,K.t160,1.2)))),'permukaan',T,K.t160);
  else if(T<K.sisa)setNum('3','sisi kena sikat',T,K.brush);
  else if(T<K.n64)setNum('?','sisanya',T,K.sisa);
  else if(T<K.plak)setNum(String(Math.round(64*ease(P(T,K.n64,1.0)))),'permukaan di sela gigi',T,K.n64);
  else if(T<K.floss)setNum('','',T,0);
  else if(T<K.scaling)setNum('1','benang gigi, tiap hari',T,K.floss);
  else if(T<K.end)setNum('2','scaling, tiap 6 bulan',T,K.scaling);
  else if(T<K.e3)setNum('','',T,0);
  else setNum('160','permukaan bersih',T,K.e3);
  // subtitle
  const s=SUBS.find(x=>T>=x[0]&&T<x[1]);sub.innerHTML=s?s[2]:'';sub.style.opacity=s?Math.min(1,P(T,s[0],0.12)):0;
  card.style.display=T>=K.card?'flex':'none';card.style.opacity=P(T,K.card,0.5);
  fade.style.background='#F4EFE6';fade.style.opacity=1-P(T,0,0.25);
};

await document.fonts.load('200 230px Outfit');await document.fonts.load('700 62px Outfit');
window.ready=true;
</script></body></html>

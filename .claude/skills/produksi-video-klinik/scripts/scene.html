<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;src:url(font2.woff2) format('woff2');font-weight:100 900;}
html,body{margin:0;padding:0;background:#F4EFE6;overflow:hidden}
#wrap{position:relative;width:1080px;height:1920px}
canvas{display:block}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;font-family:Outfit,sans-serif}
.lbl{position:absolute;left:84px;top:380px}
.p1{display:inline-block;background:#0F4F4B;color:#fff;font-weight:500;font-size:58px;padding:12px 28px 14px;border-radius:10px;letter-spacing:.3px}
.p2{display:inline-block;background:#2CCDBD;color:#06332F;font-weight:700;font-size:92px;line-height:1;padding:14px 28px 20px;border-radius:14px;margin-top:12px;letter-spacing:-1px}
.row{overflow:hidden}
.num{font-variant-numeric:tabular-nums}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="wrap"><div id="ov">
  <div class="lbl" id="g1"><div class="row"><span class="p1" id="a1">Setahun</span></div><div class="row"><span class="p2" id="a2"><span class="num" id="n">0</span> cangkir kopi</span></div></div>
  <div class="lbl" id="g2"><div class="row"><span class="p1" id="b1">Tiap pagi</span></div><div class="row"><span class="p2" id="b2">1 cangkir</span></div></div>
</div></div>
<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('wrap').prepend(renderer.domElement);

const scene=new THREE.Scene();
const BG=new THREE.Color('#F4EFE6');
scene.background=BG;scene.fog=new THREE.Fog(BG,26,70);
const camera=new THREE.PerspectiveCamera(32,W/H,0.1,200);

scene.add(new THREE.HemisphereLight(0xfff6ea,0xdfe6d8,1.15));
const sun=new THREE.DirectionalLight(0xfff1de,2.1);
sun.position.set(-9,16,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:60});
sun.shadow.radius=6;sun.shadow.bias=-0.0006;
scene.add(sun);scene.add(sun.target);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:'#EEE7DB',roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// cup geometry
function cupGeo(){
  const body=new THREE.CylinderGeometry(0.42,0.34,0.82,40,1,true);body.translate(0,0.41,0);
  const bottom=new THREE.CircleGeometry(0.34,40);bottom.rotateX(Math.PI/2);bottom.translate(0,0.005,0);
  const rim=new THREE.TorusGeometry(0.42,0.025,8,48);rim.rotateX(Math.PI/2);rim.translate(0,0.82,0);
  const handle=new THREE.TorusGeometry(0.19,0.055,12,28,Math.PI*1.1);handle.rotateZ(-Math.PI*0.55);handle.translate(0.43,0.44,0);
  return mergeGeometries([body,bottom,rim,handle].map(g=>g.toNonIndexed()));
}
const cg=cupGeo();
const coffeeG=new THREE.CircleGeometry(0.4,40);coffeeG.rotateX(-Math.PI/2);coffeeG.translate(0,0.72,0);
const cupMat=new THREE.MeshStandardMaterial({color:'#FBF8F3',roughness:0.72,side:THREE.DoubleSide});
const coffeeMat=new THREE.MeshStandardMaterial({color:'#4A2E1F',roughness:0.35});

// layout 365 cups, hero at front center (0,0,0)
const COLS=15,SP=1.35,pos=[];
for(let r=0;pos.length<365;r++){for(let c=0;c<COLS&&pos.length<365;c++){
  const x=(c-(COLS-1)/2)*SP+(r%2?SP/2:0), z=-r*SP*0.95;
  if(r===0&&c===7)continue; pos.push([x,z]);}}
pos.length=364;
const N=pos.length;
const cups=new THREE.InstancedMesh(cg,cupMat,N),coffee=new THREE.InstancedMesh(coffeeG,coffeeMat,N);
cups.castShadow=true;cups.receiveShadow=true;scene.add(cups);scene.add(coffee);
const tIn=pos.map(([x,z])=>0.1+Math.pow(Math.hypot(x,z)/Math.hypot(12,34),0.8)*2.2+((x*13.1+z*7.7)%1+1)%1*0.08);
const tOut=pos.map(([x,z])=>4.05+Math.hypot(x,z)/40*0.9);
const sorted=[...tIn].sort((a,b)=>a-b);

// hero mug with logo
const logoImg=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='mug_logo.png'});
const cv=document.createElement('canvas');cv.width=2048;cv.height=512;const cx=cv.getContext('2d');
cx.fillStyle='#FBF8F3';cx.fillRect(0,0,2048,512);
const lw=560,lh=lw*logoImg.height/logoImg.width;cx.drawImage(logoImg,1024-lw/2,256-lh/2-10,lw,lh);
const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
const hero=new THREE.Group();
const hb=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.34,0.82,64,1,true).translate(0,0.41,0),new THREE.MeshStandardMaterial({map:tex,roughness:0.7,side:THREE.DoubleSide}));
hb.rotation.y=Math.PI;
const hrest=new THREE.Mesh((()=>{const b=new THREE.CircleGeometry(0.34,40);b.rotateX(Math.PI/2);b.translate(0,0.005,0);const rim=new THREE.TorusGeometry(0.42,0.025,8,48);rim.rotateX(Math.PI/2);rim.translate(0,0.82,0);const h=new THREE.TorusGeometry(0.19,0.055,12,28,Math.PI*1.1);h.rotateZ(-Math.PI*0.55);h.translate(0.43,0.44,0);return mergeGeometries([b,rim,h].map(g=>g.toNonIndexed()))})(),cupMat);
const hc=new THREE.Mesh(coffeeG,coffeeMat);
[hb,hrest].forEach(m=>{m.castShadow=true;m.receiveShadow=true});
hero.add(hb,hrest,hc);scene.add(hero);

// steam
const steamTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const steam=[];for(let i=0;i<9;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:steamTex,transparent:true,depthWrite:false}));scene.add(s);steam.push(s)}

// desk set
const desk=new THREE.Group();scene.add(desk);
const wood=new THREE.MeshStandardMaterial({color:'#D8C09A',roughness:0.85});
const top=new THREE.Mesh(new RoundedBoxGeometry(7.6,0.28,8.4,4,0.06),wood);top.position.set(0.2,-0.14,1.2);top.receiveShadow=true;top.castShadow=true;desk.add(top);
const grey=new THREE.MeshStandardMaterial({color:'#D9D5CE',roughness:0.6});
const lap=new THREE.Group();lap.position.set(-1.9,0,-1.1);lap.rotation.y=0.35;desk.add(lap);
const lb=new THREE.Mesh(new RoundedBoxGeometry(2.0,0.07,1.35,3,0.03),grey);lb.position.y=0.035;lb.castShadow=true;lap.add(lb);
const lid=new THREE.Group();lid.position.set(0,0.07,-0.67);lid.rotation.x=-0.28;lap.add(lid);
const ll=new THREE.Mesh(new RoundedBoxGeometry(2.0,1.3,0.05,3,0.02),grey);ll.position.y=0.65;ll.castShadow=true;lid.add(ll);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.1),new THREE.MeshStandardMaterial({color:'#DCEBE2',emissive:'#CFE5D8',emissiveIntensity:0.55,roughness:0.4}));scr.position.set(0,0.65,0.03);lid.add(scr);
// calendar tent
const calCv=document.createElement('canvas');calCv.width=512;calCv.height=420;const calX=calCv.getContext('2d');
const calTex=new THREE.CanvasTexture(calCv);calTex.colorSpace=THREE.SRGBColorSpace;
function drawCal(day,num){calX.fillStyle='#FBF8F3';calX.fillRect(0,0,512,420);calX.fillStyle='#A9BFA6';calX.fillRect(0,0,512,96);
  calX.fillStyle='#fff';calX.font='600 52px Outfit';calX.textAlign='center';calX.fillText('NOVEMBER',256,66);
  calX.fillStyle='#0F4F4B';calX.font='700 170px Outfit';calX.fillText(String(num),256,280);
  calX.font='500 58px Outfit';calX.fillText(day,256,370);calTex.needsUpdate=true;}
const cal=new THREE.Group();cal.position.set(1.75,0,-1.25);cal.rotation.y=-0.35;desk.add(cal);
const cf=new THREE.Mesh(new THREE.PlaneGeometry(1.15,0.95),new THREE.MeshStandardMaterial({map:calTex,roughness:0.8}));cf.position.set(0,0.47,0.13);cf.rotation.x=-0.27;cal.add(cf);
const cb=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.0,0.03),new THREE.MeshStandardMaterial({color:'#EDE8DF'}));cb.position.set(0,0.47,0.11);cb.rotation.x=-0.27;cb.castShadow=true;cal.add(cb);
const cb2=cb.clone();cb2.position.z=-0.13;cb2.rotation.x=0.27;cal.add(cb2);
// plant
const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.24,0.5,32).translate(0,0.25,0),new THREE.MeshStandardMaterial({color:'#B9C9B2',roughness:0.9}));pot.position.set(3.0,0,-1.9);pot.castShadow=true;desk.add(pot);
const leafM=new THREE.MeshStandardMaterial({color:'#8FAE8A',roughness:0.8});
for(let i=0;i<7;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,12),leafM);l.scale.set(0.6,1.4,0.25);const a=i/7*Math.PI*2;l.position.set(3.0+Math.cos(a)*0.18,0.75+(i%3)*0.12,-1.9+Math.sin(a)*0.18);l.rotation.set(Math.sin(a)*0.5,a,Math.cos(a)*0.5);l.castShadow=true;desk.add(l)}
// empty cups pile (one per day)
const pile=[];const pilePos=[[-1.35,1.1],[-0.75,1.55],[-1.55,1.85],[-0.95,2.3]];
for(let i=0;i<4;i++){const g=new THREE.Group();const m=new THREE.Mesh(cg,cupMat);m.castShadow=true;g.add(m);g.position.set(pilePos[i][0],0,pilePos[i][1]);g.rotation.y=0.8+i*0.9;g.userData.s=0.72;desk.add(g);pile.push(g)}

await document.fonts.load('700 92px Outfit');await document.fonts.load('500 46px Outfit');
const days=[['SENIN',16],['SELASA',17],['RABU',18],['KAMIS',19],['JUMAT',20]];
drawCal(...days[0]);

const ease=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const cl=(a,b,t)=>a+(b-a)*Math.min(1,Math.max(0,t));
const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3(),P=new THREE.Vector3(),UP=new THREE.Vector3(0,1,0);
const camA=new THREE.Vector3(2.5,19,13),lookA=new THREE.Vector3(0,0,-7);
const camB=new THREE.Vector3(1.4,6.4,8.4),lookB=new THREE.Vector3(0.3,-0.6,-0.9);

function pill(el,t0,t,out){const k=back((t-t0)/0.45);let y=(1-k)*110;let o=Math.min(1,Math.max(0,(t-t0)/0.25));if(out!==undefined){const ko=ease((t-out)/0.35);y-=ko*0;o*=1-ko}el.style.transform=`translateY(${y}%)`;el.style.opacity=o}

window.renderAt=function(t){
  // cups
  let count=0;for(const v of sorted){if(v+0.12<=t)count++;}
  if(t>=0.25)count+=1; // hero
  for(let i=0;i<N;i++){
    let s=back((t-tIn[i])/0.38);
    s*=1-ease((t-tOut[i])/0.45);
    S.set(s,s,s);Q.setFromAxisAngle(UP,(i*1.7)%6.28);P.set(pos[i][0],0,pos[i][1]);
    M.compose(P,Q,S);cups.setMatrixAt(i,M);coffee.setMatrixAt(i,M);
  }
  cups.instanceMatrix.needsUpdate=true;coffee.instanceMatrix.needsUpdate=true;
  const hs=back((t-0.15)/0.4);hero.scale.setScalar(Math.max(hs,0.0001));hero.rotation.y=-0.25;
  // camera
  let cp,lk;
  const drift=new THREE.Vector3(-1.2,-1.5,-1.0);
  if(t<2.6){const k=t/2.6;cp=camA.clone().addScaledVector(drift,k);lk=lookA.clone();}
  else{const k=ease((t-2.6)/2.4);cp=camA.clone().add(drift).lerp(camB,k);lk=lookA.clone().lerp(lookB,k);}
  if(t>5.0){const k=Math.min(1,(t-5.0)/4);const off=camB.clone().sub(lookB);off.applyAxisAngle(UP,-0.28*k);off.multiplyScalar(1-0.08*k);cp=lookB.clone().add(off);lk=lookB.clone();}
  camera.position.copy(cp);camera.lookAt(lk);
  // desk rise
  ground.position.y=t>4.25?-0.6:0;const dk=ease((t-4.3)/0.9);desk.position.y=cl(-4,0,dk);desk.visible=t>4.2;
  // days
  const di=Math.min(4,Math.max(0,Math.floor((t-5.6)/0.75)+1));
  if(window._d!==di){drawCal(...days[di]);window._d=di;}
  pile.forEach((g,i)=>{const k=back((t-(5.6+0.75*i+0.05))/0.35);g.scale.setScalar(Math.max(0.0001,k*0.72))});
  // light: morning flush per day
  const ph=t>5.6?((t-5.6)%0.75)/0.75:1;sun.intensity=2.1-0.35*Math.sin(Math.PI*Math.min(1,ph*2))*(t>5.6?1:0);
  // steam
  steam.forEach((s,i)=>{const life=2.4,ph=((t*0.9+i*life/steam.length)%life)/life;const vis=t>4.6?Math.min(1,(t-4.6)):0;
    s.position.set(Math.sin(i*2.1+t*1.3)*0.12*(1+ph),0.8+ph*1.5,Math.cos(i*1.3)*0.1);s.position.applyMatrix4(hero.matrixWorld);
    const sc=0.35+ph*0.7;s.scale.set(sc,sc,sc);s.material.opacity=vis*Math.sin(Math.PI*ph)*0.9;});
  hero.updateMatrixWorld();
  renderer.render(scene,camera);
  // overlay
  document.getElementById('n').textContent=Math.min(365,count);
  pill(document.getElementById('a1'),0.35,t,4.25);pill(document.getElementById('a2'),0.5,t,4.3);
  pill(document.getElementById('b1'),5.35,t);pill(document.getElementById('b2'),5.5,t);
  document.getElementById('g1').style.display=t<4.7?'block':'none';
  document.getElementById('g2').style.display=t>=5.3?'block':'none';
};
window.ready=true;
</script></body></html>

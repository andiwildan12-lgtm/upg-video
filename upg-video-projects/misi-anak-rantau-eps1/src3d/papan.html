<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Papan gambar 3D — Eps 1</title>
<link rel="stylesheet" href="../src/_style.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#c{position:absolute;inset:0}
#ov{position:absolute;inset:0}
#logoR{position:absolute;right:70px;top:240px;width:120px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
.sub{position:absolute;left:70px;right:70px;top:1400px;text-align:center}
.sub span.b{display:inline-block;background:rgba(255,255,255,.96);border-radius:30px;padding:14px 26px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-weight:900;font-size:54px;line-height:1.25;color:#2A2A2A}
.nm{display:inline-block;color:#fff;border-radius:12px;padding:0 14px;margin-right:12px;font-size:34px;vertical-align:middle}
.hl{background:#FA7209;color:#fff;border-radius:14px;padding:0 12px}
.chat{position:absolute;max-width:470px;background:#fff;border-radius:30px 30px 30px 8px;padding:22px 28px;font-weight:800;font-size:40px;line-height:1.2;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.chat small{display:block;font-size:28px;color:#1FAF55;margin-bottom:6px;font-weight:900}
.mem{position:absolute;border-radius:40px;border:6px dashed rgba(255,255,255,.9);padding:12px}
.tag{position:absolute;color:#fff;font-weight:900;border-radius:18px;padding:10px 22px;font-size:38px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.card{position:absolute;left:90px;right:90px;background:rgba(255,255,255,.95);border-radius:40px;padding:34px 44px;box-shadow:0 20px 50px rgba(0,0,0,.3);height:auto;display:block}
.row{display:flex;align-items:center;gap:24px;margin:14px 0;font-weight:900;font-size:48px}
.row i{font-style:normal;width:70px;height:70px;border-radius:50%;background:#22A45D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;flex:none}
.big{position:absolute;right:70px;top:380px;text-align:right;color:#fff;font-family:Georgia,serif;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.timecard{position:absolute;left:0;right:0;top:300px;text-align:center}
.timecard span{display:inline-block;background:rgba(42,42,42,.85);color:#fff;font-weight:900;font-size:44px;border-radius:999px;padding:12px 36px}
.cap{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5)}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"></div>
<img id="logoR" src="../assets/logo-upg-putih.png">
<script src="vendor/three.min.js"></script>
<script src="dunia.js"></script>
<script>
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
R.setSize(1080,1920,false); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap; R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05;
const SPC={NARATOR:'#555',IJAL:'#FA7209',DINDA:'#2F80C0',PAMAN:'#2E9E6B'};
const sub=(sp,html)=>`<div class="sub"><span class="b">${sp&&sp!=='NARATOR'?`<span class="nm" style="background:${SPC[sp]}">${sp}</span>`:''}${html}</span></div>`;
const H=w=>`<span class="hl">${w}</span>`;
function cam(fov,pos,look){const c=new THREE.PerspectiveCamera(fov,1080/1920,0.05,60);c.position.set(...pos);c.lookAt(...look);return c;}
let DARK=0; function fresh(){W3.S=new THREE.Scene();}
const T=(html,c)=>`<div class="tag" style="position:relative;background:${c}">${html}</div>`;
const FR={
 1:()=>{fresh();W3.bathroom(false);W3.foam.visible=false;W3.blood.forEach(b=>b.visible=false);
   const ij=W3.ijal({pos:[0.75,0,-0.3],ry:-0.25,L:'down',R:'brush',mood:'grin'}); W3.toothbrush(ij,[0.22,1.68,0.38],false,[0,0,1.35]);
   return {cam:cam(44,[1.9,2.0,3.9],[0.45,1.45,-0.5]),ov:`<div class="mem" style="left:70px;top:330px"><div class="chat" style="position:relative"><small>Ibu · semalam</small>Jaga diri ya, Nak. Jangan lupa sikat gigi.</div></div>`+sub('NARATOR',`…semalam dia baru ${H('janji')} ke ibunya, bisa urus diri sendiri.`)};},
 2:()=>{fresh();W3.bathroom(false);
   W3.ijal({pos:[0.85,0,0.95],ry:Math.PI,L:'head',R:'head',mood:'o'});
   return {cam:cam(50,[0.95,1.12,-1.05],[0.88,1.6,0.9]),ov:sub('IJAL',`Lho… kok ${H('merah?!')} Kak… Kak Dinda!!`)};},
 3:()=>{fresh();W3.bathroom(false);
   W3.ijal({pos:[0.75,0,0.1],ry:-0.7,L:'point',R:'down',mood:'worry'});
   W3.dinda({pos:[-0.8,0,0.5],ry:0.55,L:'down',R:'hold',mood:'worry'});
   return {cam:cam(46,[0,1.95,5.6],[0,1.25,0]),ov:sub('DINDA',`Ijal… itu ${H('darah.')} Pernah begini sebelumnya?`)};},
 4:()=>{fresh();W3.bathroom(false);
   W3.ijal({pos:[0.8,0,0.1],ry:-0.6,L:'down',R:'down',mood:'smile'});
   W3.dinda({pos:[-0.55,0,0.6],ry:0.45,L:'cross',R:'cross',mood:'flat'});
   const pm=W3.paman({pos:[-1.3,0,-0.6],ry:0.5,L:'down',R:'cup',mood:'smile'}); W3.mug(pm,[0.2,1.3,0.32]);
   return {cam:cam(46,[0,1.95,5.6],[0,1.25,0]),ov:sub('PAMAN',`Ah, gusi berdarah itu ${H('biasa')} ji.`)};},
 5:()=>{fresh();W3.bathroom(false);
   W3.ijal({pos:[0.7,0,-0.2],ry:-0.6,L:'raise',R:'down',mood:'grin'});
   const dn=W3.dinda({pos:[-0.45,0,0.6],ry:0.35,L:'down',R:'phone',mood:'flat'}); W3.phone(dn,[0.06,1.32,0.4],[0.6,0,0]);
   return {cam:cam(44,[0,1.9,4.6],[0.05,1.4,0]),ov:`<div class="chat" style="left:90px;top:400px;border-radius:30px"><small style="color:#888">🔍 hasil pencarian</small>Gusi berdarah karena <span style="color:#E0533D">kurang vitamin C?</span></div>`+sub('DINDA',`…katanya karena kurang ${H('vitamin')} ${H('C.')}`)};},
 6:()=>{fresh();W3.livingroom();
   const ij=W3.ijal({pos:[-0.7,0,0.4],ry:0.3,L:'down',R:'raise',mood:'grin'}); W3.toothbrush(ij,[0.3,1.92,0.25],false,[0,0,-0.2]);
   const dn=W3.dinda({pos:[0.65,0,0.5],ry:-0.35,L:'hold',R:'down',mood:'smile'}); W3.orangeBag(dn,[-0.3,0.92,0.42]);
   const pm=W3.paman({pos:[1.25,0,-1.0],ry:-0.5,L:'down',R:'cup',mood:'smile'}); W3.mug(pm,[0.2,1.3,0.32]);
   return {cam:cam(48,[0,2.0,6.0],[0.05,1.3,0]),anchors:[[dn,0.5,T('🍊 3 KG','#F7931E')]],ov:`<div class="tag" style="left:90px;top:520px;background:#E0533D">BULU EXTRA KERAS</div><div class="timecard"><span>Siang harinya…</span></div>`+sub('IJAL',`Kak… itu jeruk buat ${H('sebulan?')}`)};},
 7:()=>{fresh();W3.livingroom();
   const ij=W3.ijal({pos:[-0.7,0,0.4],ry:0.3,L:'down',R:'raise',mood:'grin'}); W3.toothbrush(ij,[0.3,1.92,0.25],false,[0,0,-0.2]);
   const dn=W3.dinda({pos:[0.65,0,0.5],ry:-0.35,L:'hold',R:'down',mood:'smile'}); W3.orangeBag(dn,[-0.3,0.92,0.42]);
   const pm=W3.paman({pos:[1.25,0,-1.0],ry:-0.5,L:'down',R:'cup',mood:'smile'}); W3.mug(pm,[0.2,1.3,0.32]);
   return {cam:cam(48,[0,2.0,6.0],[0.05,1.3,0]),filter:'grayscale(.75) brightness(.8)',ov:`<div class="tag" style="left:560px;top:430px;background:#2E9E6B">MITOS 1 · "Biasa ji"</div><div class="tag" style="left:70px;top:540px;background:#FA7209">MITOS 2 · Sikat lebih keras</div><div class="tag" style="left:440px;top:650px;background:#2F80C0">MITOS 3 · Kurang vitamin C</div>`+sub('NARATOR',`Tunggu dulu. Ada ${H('tiga')} hal yang perlu diluruskan.`)};},
 8:()=>{DARK=1;fresh();W3.mouth();
   return {cam:cam(45,[0.4,1.3,3.6],[0,0.15,0]),ov:`<div class="tag" style="left:90px;top:640px;background:#C9902B">PLAK · lapisan kuman</div><div class="tag" style="left:560px;top:1120px;background:#D9473F">GUSI MERADANG</div><div class="big" style="top:420px"><div style="font-size:120px;line-height:1">bukan</div><div style="font-size:44px;font-family:Nunito;font-weight:800">hal biasa</div></div>`+sub('NARATOR',`Gusi berdarah ${H('bukan')} ${H('hal')} ${H('biasa.')}`)};},
 9:()=>{DARK=1;fresh();W3.mouth();W3.plaque.forEach(p=>p.visible=false);W3.swell.forEach(p=>p.visible=false);W3.drops.forEach(p=>p.visible=false);W3.gumMat.color.set('#F1A7A0');
   const g=W3.toothbrush(W3.S,[0.55,0.85,1.5],true,[0.1,0,1.5]); g.scale.setScalar(2.6);
   return {cam:cam(45,[0.4,1.3,3.6],[0,0.15,0]),ov:`<div class="big" style="top:420px"><div style="font-size:150px;line-height:1">2×</div><div style="font-size:44px;font-family:Nunito;font-weight:800">sehari</div></div><div class="card" style="top:1020px;padding:24px 40px"><div class="row"><i>✓</i>Sikat bulu <span style="color:#22A45D">LEMBUT</span></div><div class="row"><i>✓</i>Pelan di batas gusi</div><div class="row"><i>✓</i>Bersihkan sela gigi</div></div>`+sub('NARATOR',`Pakai sikat bulu ${H('lembut,')} dua kali sehari…`)};},
 10:()=>{DARK=1;fresh();W3.mouth();W3.plaque.forEach(p=>p.scale.multiplyScalar(1.4));
   return {cam:cam(40,[1.6,0.9,2.6],[0.3,0.2,0]),ov:`<div class="big" style="top:400px"><div style="font-size:52px;font-family:Nunito;font-weight:800">masih berdarah</div><div style="font-size:150px;line-height:1">&gt; 2</div><div style="font-size:52px;font-family:Nunito;font-weight:800">minggu?</div></div><div class="card" style="top:1060px;text-align:center"><div style="display:inline-block;background:#FA7209;color:#fff;border-radius:22px;padding:12px 32px;font-weight:900;font-size:50px">Periksa ke dokter gigi</div><div style="font-weight:700;font-size:34px;color:#6b5a50;margin-top:16px">Karang gigi tidak hilang hanya dengan sikat gigi</div></div>`+sub('NARATOR',`…periksa ke ${H('dokter')} ${H('gigi.')}`)};},
 11:()=>{DARK=1;fresh();W3.bathroom(true);W3.foam.visible=false;W3.blood.forEach(b=>b.visible=false);
   const ij=W3.ijal({pos:[0.75,0,0.0],ry:-0.35,L:'down',R:'brush',mood:'o'}); W3.toothbrush(ij,[0.22,1.68,0.38],true,[0,0,1.35]);
   const dn=W3.dinda({pos:[-0.75,0,0.5],ry:0.45,L:'note',R:'down',mood:'smile'}); W3.notebook(dn,[-0.12,1.22,0.34]);
   const cal=W3.tex((g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='#E0533D';g.fillRect(0,0,w,h*0.28);g.fillStyle='#fff';g.font='900 70px Nunito';g.textAlign='center';g.fillText('HARI',w/2,h*0.2);g.fillStyle='#2A2A2A';g.font='900 190px Nunito';g.fillText('1/14',w/2,h*0.8);},512,512);
   W3.mesh(new THREE.PlaneGeometry(0.55,0.55),new THREE.MeshStandardMaterial({map:cal}),-0.25,2.25,-1.58,{cs:false});
   return {cam:cam(46,[0,1.95,5.6],[0,1.3,0]),ov:`<div class="chat" style="left:70px;top:380px"><small>Ibu</small>Nak, piringnya sudah dicuci? 🍽️</div>`+sub('IJAL',`…${H('Belum.')}`)};},
 12:()=>{fresh();W3.exterior();
   return {cam:cam(46,[0.6,2.4,11],[0,2.6,0]),hideLogo:true,ov:`<div class="cap" style="top:250px"><img src="../assets/logo-upg-putih.png" style="width:140px"></div><div class="cap" style="top:430px;font-size:40px;letter-spacing:6px;color:#F8C000">SERIAL</div><div class="cap" style="top:480px;font-size:100px;line-height:1">MISI ANAK<br>RANTAU</div><div class="cap" style="top:1180px"><span style="display:inline-block;background:rgba(30,42,74,.85);border-radius:24px;padding:10px 28px;font-size:50px">Bisakah Ijal bertahan <span style="color:#F8C000">14 hari?</span></span></div><div class="cap" style="top:1285px"><span style="display:inline-block;background:#fff;color:#2A2A2A;border-radius:26px;padding:16px 30px;font-size:34px;font-weight:800;text-shadow:none">💬 Kamu pernah gusi berdarah? Apa yang kamu lakukan?</span></div>`};},
};
window.renderFrame=function(n){DARK=0;const f=FR[n]();f.darkLogo=DARK;R.render(W3.S,f.cam);document.getElementById('c').style.filter=f.filter||'none';f.cam.updateMatrixWorld(true);let an='';(f.anchors||[]).forEach(([o,y,html])=>{o.updateMatrixWorld(true);const v=new THREE.Vector3(0,y,0).applyMatrix4(o.matrixWorld).project(f.cam);an+=`<div style="position:absolute;left:${(v.x+1)/2*1080}px;top:${(1-v.y)/2*1920}px;transform:translate(-50%,-100%)">${html}</div>`;});document.getElementById('ov').innerHTML=(f.ov||'')+an;const lg=document.getElementById('logoR');lg.style.display=f.hideLogo?'none':'block';lg.src=f.darkLogo?'../assets/logo-upg-putih.png':'../assets/logo-upg-transparan.png';return true;};
window.READY=true;
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:N;font-weight:800;src:url(nunito-latin-800-normal.woff2)}
@font-face{font-family:N;font-weight:900;src:url(nunito-latin-900-normal.woff2)}
*{margin:0;box-sizing:border-box} body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:N}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 58%,rgba(0,0,0,.65) 85%)}
.top{position:absolute;left:70px;right:70px;top:250px;text-align:center}
.kicker{display:inline-block;background:#fff;color:#CF6515;font-weight:900;font-size:44px;padding:8px 28px;border-radius:999px;letter-spacing:1px}
.h1{margin-top:22px;color:#fff;font-weight:900;font-size:118px;line-height:1.24;text-shadow:0 6px 24px rgba(0,0,0,.55)}
.h1 span{background:#FA7209;padding:2px 24px 10px;border-radius:24px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.bot{position:absolute;left:70px;right:70px;top:1230px;text-align:center;color:#fff}
.sub{font-weight:900;font-size:66px;line-height:1.1;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.sub b{color:#F8C000}
.logo{position:absolute;left:50%;transform:translateX(-50%);top:1415px;width:190px}
</style></head><body>
<img class="bg" src="BG"><div class="shade"></div>
<div class="top"><div class="kicker">KICKER</div><div class="h1">H1</div></div>
<div class="bot"><div class="sub">SUB</div></div>
<img class="logo" src="logo-upg-putih.png">
</body></html>

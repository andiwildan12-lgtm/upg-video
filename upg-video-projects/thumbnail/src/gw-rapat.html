<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:600;src:url(montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(montserrat-latin-900-normal.woff2)}
/* HEAD = Neue Montreal (menunggu file berlisensi dari Dir); sementara Montserrat */
:root{--g:#00691d;--y:#fbb03b;--g2:#009b5f;--ink:#000}
*{margin:0;box-sizing:border-box} body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:M}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(245,238,226,.95) 0%,rgba(245,238,226,.85) 30%,rgba(245,238,226,0) 46%)}
.pill{display:inline-block;background:var(--g);color:#fff;font-weight:800;font-size:38px;letter-spacing:1px;padding:12px 30px;border-radius:999px;border:5px solid var(--ink)}
.head{font-family:'Neue Montreal',M;font-weight:900;color:var(--g);font-size:92px;line-height:1.08;margin-top:30px;letter-spacing:-1px}
.hl{display:inline-block;background:var(--y);color:var(--ink);padding:0 22px 6px;border-radius:22px;border:5px solid var(--ink);margin:6px 0}
.handle{position:absolute;left:50%;transform:translateX(-50%);top:1580px;background:var(--y);color:var(--ink);font-weight:800;font-size:38px;padding:10px 30px;border-radius:999px;border:5px solid var(--ink);white-space:nowrap}
</style></head><body>
<img class="bg" src="fA.png"><div class="fade"></div>
<div style="position:absolute;left:70px;right:70px;top:260px">
<div class="pill">RAPAT DOKTER HARI INI 👀</div>
<div class="head">Rapor dokter<br><span class="hl">dibuka</span> atau<br><span class="hl">dirahasiakan?</span></div></div>
<div class="handle">@growwithupgruma</div>
</body></html>

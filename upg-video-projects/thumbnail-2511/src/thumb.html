<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:N;src:url(nunito-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:N;src:url(nunito-latin-900-normal.woff2);font-weight:900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:N}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;left:0;right:0;bottom:0;height:1100px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.55))}
.logo{position:absolute;top:300px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:18px 34px}
.logo img{height:58px;display:block}
.box{position:absolute;left:90px;right:90px;top:1000px;text-align:center}
.l1{display:inline-block;white-space:nowrap;background:#fff;color:#2A2A2A;font-weight:900;font-size:84px;line-height:1.12;padding:14px 34px;border-radius:22px}
.l2{display:inline-block;white-space:nowrap;margin-top:16px;background:#FA7209;color:#2A2A2A;font-weight:900;font-size:92px;line-height:1.1;padding:14px 34px;border-radius:22px}
.tag{display:inline-block;margin-top:22px;background:#2A2A2A;color:#fff;font-weight:800;font-size:40px;padding:10px 26px;border-radius:999px}
</style></head><body>
<div class="bg" id="bg"></div><div class="shade"></div>
<div class="logo"><img src="logo-upg-mendatar.png"></div>
<div class="box"><div class="l1" id="l1"></div><br><div class="l2" id="l2"></div><div id="tg"></div></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('bg').style.backgroundImage=`url(${q.get('bg')})`;
document.getElementById('l1').innerHTML=q.get('l1');document.getElementById('l2').innerHTML=q.get('l2');
for(const id of ['l1','l2']){const e=document.getElementById(id);let f=parseFloat(getComputedStyle(e).fontSize);while(e.offsetWidth>900&&f>40){f-=2;e.style.fontSize=f+'px';}}
if(q.get('tag')) document.getElementById('tg').innerHTML=`<br><span class="tag">${q.get('tag')}</span>`;
</script></body></html>

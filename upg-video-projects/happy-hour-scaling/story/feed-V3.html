<script>
// Jam "Happy Hour": irisan oranye 10.00 -> 14.00 + gigi bersih (ilustrasi, tanpa wajah)
const R=230,C=240;
const pt=(h,r)=>{const a=(h/12)*2*Math.PI-Math.PI/2;return [C+r*Math.cos(a),C+r*Math.sin(a)]};
const [x1,y1]=pt(10,R-18),[x2,y2]=pt(14,R-18);
let ticks='';for(let h=0;h<12;h++){const on=(h>=10||h<=2);const [a,b]=pt(h,R-30),[c,d]=pt(h,R-(h%3?46:62));ticks+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${on?'#FFFFFF':'#D9C6B2'}" stroke-width="${h%3?8:12}" stroke-linecap="round"/>`}
const CROWN="M80,120 C78,58 140,38 200,70 C260,38 322,58 320,120 C328,200 312,262 302,304 C296,340 284,372 262,372 C240,372 236,330 222,300 C214,284 186,284 178,300 C164,330 160,372 138,372 C116,372 104,340 98,304 C88,262 72,200 80,120 Z";
const star=(x,y,s,f)=>`<path transform="translate(${x},${y}) scale(${s})" d="M0,-30 C4,-6 6,-4 30,0 C6,4 4,6 0,30 C-4,6 -6,4 -30,0 C-6,-4 -4,-6 0,-30 Z" fill="${f}"/>`;
const L=(h,dx,t)=>{const [x,y]=pt(h,R-98);return `<text x="${x+dx}" y="${y+12}" font-family="Poppins" font-weight="800" font-size="34" fill="#333333" text-anchor="middle">${t}</text>`};
document.getElementById('clock').innerHTML=`<svg viewBox="0 0 480 480" width="380" height="380" style="overflow:visible">
 <circle cx="${C}" cy="${C+14}" r="${R}" fill="#8B542F" opacity=".35"/>
 <circle cx="${C}" cy="${C}" r="${R}" fill="#FFFFFF"/>
 <path d="M${C},${C} L${x1},${y1} A${R-18},${R-18} 0 0 1 ${x2},${y2} Z" fill="#E97818"/>
 <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#F8EEE2" stroke-width="16"/>
 ${ticks}
 ${L(10,8,'10.00')}${L(14,-8,'14.00')}
 <g transform="translate(${C-110},${C-40}) scale(.55)">
   <path d="${CROWN}" fill="#fff" stroke="#D9C6B2" stroke-width="10"/>
   <path d="M116,112 C118,84 140,72 164,76" stroke="#F1E6DA" stroke-width="18" fill="none" stroke-linecap="round"/>
 </g>
 ${star(C+118,C+40,.9,'#E97818')}${star(C-120,C+70,.6,'#E97818')}${star(C+92,C+120,.5,'#8B542F')}
</svg>`;
if(location.hash==='#guide')document.body.classList.add('guide');

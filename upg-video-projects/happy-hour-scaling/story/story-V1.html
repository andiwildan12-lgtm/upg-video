<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Nunito;font-weight:600;src:url(nunito-latin-600-normal.woff2)}
@font-face{font-family:Nunito;font-weight:800;src:url(nunito-latin-800-normal.woff2)}
@font-face{font-family:Nunito;font-weight:900;src:url(nunito-latin-900-normal.woff2)}
:root{--or:#FA7209;--yl:#F8C000;--or2:#CF6515;--ink:#2A2A2A;--bg:#FFF7EF;--wa:#1FAF55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:Nunito,sans-serif;color:var(--ink)}
.abs{position:absolute}
#foto{left:0;top:-250px;width:1080px;height:1080px;background:url(foto-resepsionis.jpg) center top/cover}
#fade{left:0;top:560px;width:1080px;height:280px;background:linear-gradient(to bottom,rgba(255,247,239,0),var(--bg) 85%)}
#hook{left:60px;right:60px;top:700px;height:270px;background:#fff;border-radius:44px;box-shadow:0 18px 48px rgba(207,101,21,.18);display:flex;align-items:center;gap:26px;padding:0 44px 0 30px}
#tooth{width:210px;height:220px;flex:none}
#hook h1{font-weight:900;font-size:60px;line-height:1.06;letter-spacing:-.5px}.nw{white-space:nowrap}
#hook p{margin-top:14px;font-weight:800;font-size:40px;line-height:1.15;color:var(--ink)}
#hook p b{color:#fff;background:var(--or);border-radius:14px;padding:0 14px;font-weight:900}
#promo{left:60px;right:60px;top:990px;height:455px;border-radius:48px;background:linear-gradient(160deg,#FA7209 0%,#FB8A12 55%,#F8B000 100%);box-shadow:0 22px 54px rgba(250,114,9,.32);text-align:center;color:#fff;overflow:hidden}
#promo .k{margin-top:40px;font-weight:900;font-size:34px;letter-spacing:6px;opacity:.95}
#promo .t{margin-top:30px;font-weight:900;font-size:92px;line-height:1;letter-spacing:-1px}
#promo .t2{font-weight:900;font-size:58px;letter-spacing:4px;line-height:1.1}
#price{display:inline-block;margin-top:16px;background:#fff;color:var(--or);border-radius:30px;padding:4px 52px 10px;font-weight:900;font-size:112px;line-height:1.05;letter-spacing:-2px;box-shadow:0 12px 30px rgba(140,60,0,.22)}
#price small{font-size:64px;letter-spacing:0;margin-right:6px}
#when{margin-top:20px;font-weight:900;font-size:42px;display:flex;justify-content:center;gap:30px;align-items:center}
#when span{display:flex;align-items:center;gap:12px}
#when svg{width:42px;height:42px}
#sk{margin-top:8px;font-weight:800;font-size:26px}
#wa{left:60px;right:60px;top:1462px;height:110px;border-radius:999px;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;gap:20px;font-weight:900;font-size:52px;box-shadow:0 14px 34px rgba(31,175,85,.32)}
#wa .ic{width:74px;height:74px;background:#fff;border-radius:50%;padding:6px}
#wa em{font-style:normal;font-weight:800;font-size:36px;opacity:.95}
#chip{left:0;right:0;top:1800px;text-align:center}
#chip span{display:inline-block;background:#fff;border-radius:999px;padding:10px 30px;font-weight:800;font-size:30px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
#logo{left:50%;top:1600px;width:170px;transform:translateX(-50%)}
#safe{display:none}
body.guide #safe{display:block}
.sz{position:absolute;left:0;width:1080px;background:rgba(224,83,61,.18);border:3px dashed #E0533D;color:#E0533D;font:800 30px Nunito;display:flex;align-items:center;justify-content:center}
</style></head>
<body>
<div id="foto" class="abs"></div>
<div id="fade" class="abs"></div>

<div id="hook" class="abs">
  <div id="tooth"></div>
  <div>
    <h1>Kerak kuning nggak <span class="nw">hilang-hilang?</span></h1>
    <p>Itu karang gigi. Solusinya <b class="nw">SCALING</b></p>
  </div>
</div>

<div id="promo" class="abs">
  <div class="t">HAPPY HOUR</div>
  <div class="t2">SCALING</div>
  <div id="price"><small>Rp</small>200.000</div>
  <div id="when">
    <span><svg viewBox="0 0 100 100"><rect x="8" y="16" width="84" height="78" rx="14" fill="none" stroke="#fff" stroke-width="9"/><path d="M8,40 L92,40" stroke="#fff" stroke-width="9"/><rect x="26" y="4" width="10" height="22" rx="5" fill="#fff"/><rect x="64" y="4" width="10" height="22" rx="5" fill="#fff"/></svg>Senin–Jumat</span>
    <span><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="9"/><path d="M50,24 L50,52 L68,62" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/></svg>10.00–14.00 WITA</span>
  </div>
  <div id="sk">S&amp;K berlaku</div>
</div>

<div id="wa" class="abs">
  <div class="ic"><svg viewBox="0 0 200 200" width="100%" height="100%"><path d="M100,14 C52,14 14,50 14,96 C14,114 20,130 30,144 L20,186 L64,174 C76,180 88,182 100,182 C148,182 186,144 186,96 C186,50 148,14 100,14 Z" fill="#1FAF55"/><path d="M72,62 C66,62 60,70 62,82 C66,108 92,134 118,140 C130,142 138,136 138,130 L138,118 C138,114 134,112 130,110 L116,104 C112,102 108,104 106,108 L102,114 C90,108 84,102 78,90 L84,86 C88,84 90,80 88,76 L82,64 C80,62 76,62 72,62 Z" fill="#fff"/></svg></div>
  <div><em>Wajib booking · </em>089673415806</div>
</div>

<img id="logo" class="abs" src="logo-upg-transparan.png">
<div id="chip" class="abs"><span>Ruang tunggu nyaman · snack, minuman &amp; es krim gratis</span></div>

<div id="safe">
  <div class="sz" style="top:0;height:250px">Zona aman atas (nama akun)</div>
  <div class="sz" style="bottom:0;height:340px">Zona tombol iklan Meta</div>
</div>

<script>
const CROWN="M80,120 C78,58 140,38 200,70 C260,38 322,58 320,120 C328,200 312,262 302,304 L98,304 C88,262 72,200 80,120 Z";

 <circle cx="200" cy="210" r="200" fill="#FFF1E2"/>

 <g clip-path="url(#c)">
  <path d="M80,304 C96,272 128,258 160,268 C182,252 214,262 236,252 C262,262 292,258 320,304 Z" fill="#D9A43A"/>
  <path d="M104,292 C126,280 148,286 166,280 M206,274 C230,266 252,274 276,268" stroke="#B9821F" stroke-width="8" fill="none" stroke-linecap="round" opacity=".7"/>
  <circle cx="132" cy="284" r="5" fill="#C48E2B"/><circle cx="248" cy="278" r="6" fill="#C48E2B"/><circle cx="196" cy="290" r="4" fill="#C48E2B"/>
 </g>
 <path d="M80,304 C96,272 128,258 160,268 C182,252 214,262 236,252 C262,262 292,258 320,304" fill="none" stroke="#FA7209" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 18"/>
 <path d="M20,300 Q110,258 200,294 Q290,258 380,300" fill="none" stroke="#EE8E84" stroke-width="8"/>
</svg>`;
if(location.hash==='#guide')document.body.classList.add('guide');
</script>
</body></html>
